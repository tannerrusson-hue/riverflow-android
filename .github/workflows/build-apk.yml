name: Build RiverFlow APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RiverFlow Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Download repo
        uses: actions/checkout@v7

      - name: Unpack RiverFlow Android project
        run: |
          rm -rf riverflow-src
          mkdir riverflow-src
          unzip -q RiverFlow-Android-Phone-Build-Auto.zip -d riverflow-src

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build RiverFlow APK
        working-directory: riverflow-src
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          cp riverflow-src/app/build/outputs/apk/debug/app-debug.apk RiverFlow.apk

      - name: Upload RiverFlow APK
        uses: actions/upload-artifact@v7
        with:
          name: RiverFlow-APK
          path: RiverFlow.apk
          retention-days: 30
