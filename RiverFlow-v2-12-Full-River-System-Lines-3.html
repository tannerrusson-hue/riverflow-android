 return`<img ${cls?`class="${cls}"`:''} src="${src}" data-bugphoto="${r.id}" data-remote="${E(remote)}" data-fallback="${E(fallback)}" alt="${E(r.name)} real-world field reference">`
}
async function cacheBugRemote(id,url){
 if(!url||BUG_PHOTO_CACHE[id]||BUG_PHOTO_LOADING[id])return;BUG_PHOTO_LOADING[id]=1;
 try{
  let res=await fetch(url,{mode:'cors',cache:'force-cache'});if(!res.ok)throw Error('photo '+res.status);let blob=await res.blob(),u=URL.createObjectURL(blob),im=new Image();
  await new Promise((resolve,reject)=>{im.onload=resolve;im.onerror=reject;im.src=u});let max=760,scale=Math.min(1,max/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*scale)),h=Math.max(1,Math.round(im.height*scale)),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);let data=c.toDataURL('image/jpeg',.84);URL.revokeObjectURL(u);await putBugPhoto(id,data);document.querySelectorAll(`[data-bugphoto="${id}"]`).forEach(x=>x.src=data)
 }catch{}finally{delete BUG_PHOTO_LOADING[id]}
}
async function hydrateBugPhotos(){
 let imgs=[...document.querySelectorAll('[data-bugphoto]')];for(let img of imgs){let id=img.dataset.bugphoto,cached=await getBugPhoto(id);if(cached){img.src=cached;continue}let remote=img.dataset.remote;if(remote){img.onerror=()=>{img.onerror=null;img.src=img.dataset.fallback||''};img.src=remote;cacheBugRemote(id,remote)}}
}
async function deleteBoxImage(id){
 delete BOX_IMAGE_CACHE[id];try{localStorage.removeItem('riverflow-box-photo-'+id)}catch{};try{let db=await boxDb();await new Promise((resolve,reject)=>{let t=db.transaction(BOX_DB_STORE,'readwrite'),q=t.objectStore(BOX_DB_STORE).delete(id);q.onsuccess=()=>resolve();q.onerror=()=>reject(q.error)});db.close()}catch{}
}
function saveBoxes(){
 let clean=BOXES.map(b=>({id:b.id,name:b.name||'Fly Box',flies:Array.isArray(b.flies)?b.flies:[]}));
 localStorage.setItem(BOX_META_KEY,JSON.stringify(clean));localStorage.setItem(BOX_ACTIVE_KEY,ACTIVE_BOX_ID)
}
function activateBox(id){let b=BOXES.find(x=>x.id===id);if(!b)return;ACTIVE_BOX_ID=id;BOX=b;localStorage.setItem(BOX_ACTIVE_KEY,id)}
function mappedCount(){return BOXES.reduce((n,b)=>n+(b.flies?.length||0),0)}

function rankBoxFlies(recs,limit=5){return allBoxFlies().map(f=>({...f,score:scoreBoxFly(f,recs)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,limit)}

async function removeActiveBox(){

}
async function initFlyBoxes(){
 try{await navigator.storage?.persist?.()}catch{}
 for(let b of BOXES){
  if(b.legacyImage){await putBoxImage(b.id,b.legacyImage);delete b.legacyImage}

 (BUG_EXACT_EXTRA_PHOTOS[r.id]||[]).forEach((x,i)=>out.push({...x,key:`${r.id}-exact-${i}`,fallback}));

const prof=g=>P[g.id]||null, report=g=>REPORTS[g.id]||null;
function reportState(r){if(!r)return{label:'No recent local report',cls:'low',age:999};let d=DAYS(r.date);return d<=7?{label:`Fresh report · ${d}d`,cls:'high',age:d}:d<=14?{label:`Recent report · ${d}d`,cls:'high',age:d}:d<=30?{label:`Aging report · ${d}d`,cls:'mid',age:d}:{label:`Stale report · ${d}d`,cls:'low',age:d}}
function heatNote(g){let p=prof(g);if(!p?.heat)return null;if(g.id.startsWith('1301')||g.id==='13022500')return HEAT.snake;if(g.id.startsWith('0919')||g.id==='09205000')return HEAT.newfork;return null}
function tempScore(t){if(t==null)return 3;if(t<42)return 2;if(t<=60)return 18;if(t<=64)return 16;if(t<=67)return 9;if(t<70)return 0;if(t<=72)return-28;return-45}
function seasonal(p,plan=PLAN){if(!p)return 0;let month=MONTH();if(plan==='spring')month=4;if(plan==='summer')month=7;if(plan==='fall')month=10;if(plan==='winter')month=1;let hit=p.peak.includes(month),near=p.peak.some(x=>Math.min(Math.abs(x-month),12-Math.abs(x-month))===1);return hit?13:near?6:-4}
function weatherScore(g){if(!(PLAN==='now'||PLAN==='weekend'))return 0;let d=WX[g.id]?.days?.[PLAN==='weekend'?1:0];if(!d)return 0;let s=0,wind=parseInt(String(d.windSpeed||'').match(/\d+/)?.[0]||0),rain=Number(d.precip||0);if(wind<=8)s+=5;else if(wind>=20)s-=7;else if(wind>=15)s-=3;if(rain>=70)s-=5;else if(rain<=25)s+=2;return s}
function reportScore(g){let r=report(g);if(!r||!(PLAN==='now'||PLAN==='weekend'))return 0;let d=DAYS(r.date),fresh=d<=7?1:d<=14?.75:d<=30?.3:0;return Math.round((r.rating-2.5)*7*fresh)}
function freshnessScore(g){let h=(Date.now()-new Date(g.time))/36e5;if(h<=1)return 5;if(h<=3)return 2;if(h<=12)return-2;return-9}
function SCORE(g){let p=prof(g),n=43+tempScore(g.tempF)+freshnessScore(g)+weatherScore(g)+reportScore(g)+seasonal(p);if(p?.blue)n+=6;if(p?.trophyVerified)n+=2;if(g.cfs<=0)n-=24;let hn=heatNote(g);if(hn&&(PLAN==='now'||PLAN==='weekend')&&g.tempF!=null&&g.tempF>=65)n-=8;return{n:Math.max(5,Math.min(98,Math.round(n)))}}
function CONF(g){let p=prof(g),r=report(g),rs=reportState(r),pts=0,why=[];let h=(Date.now()-new Date(g.time))/36e5;if(h<=2){pts+=2;why.push('live gauge')}else why.push('older gauge');if(g.tempF!=null){pts++;why.push('water temp')}if(p?.agencyUrl){pts+=2;why.push('agency fishery data')}if(p?.trophyVerified){pts++;why.push('verified size evidence')}if(rs.age<=7){pts+=3;why.push('fresh local report')}else if(rs.age<=14){pts+=2;why.push('recent local report')}else if(rs.age<=30){pts++;why.push('aging local report')}if(WX[g.id]){pts++;why.push('forecast')}let label=pts>=8?'High':pts>=5?'Moderate':'Low';return{label,pts,why,report:rs}}
function scoreClass(n){return n>=84?'hot':n>=70?'good':n>=55?'fair':'poor'}
function planLabel(){return({now:'Right now',weekend:'This weekend',spring:'Spring',summer:'Summer',fall:'Fall',winter:'Winter'})[PLAN]}
function hav(a,b,c,d){const R=3958.8,rad=x=>x*Math.PI/180,p1=rad(a),p2=rad(c),dp=rad(c-a),dl=rad(d-b),h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function DIST(g){return LOC&&Number.isFinite(g.lat)&&Number.isFinite(g.lng)?hav(LOC.lat,LOC.lng,g.lat,g.lng):null}
function distText(g){let d=DIST(g);return d==null?'':`${Math.round(d)} mi`}
function likelyFishing(g){if(P[g.id])return true;let n=(' '+(g.name||'').toUpperCase().replace(/[^A-Z0-9]+/g,' ')+' ');if(/ CANAL | DRAIN | SEWAGE | FLOODWAY | SPILLBACK | WASTEWATER | OUTFALL /.test(n))return false;return / RIVER | RIV | CREEK | CR | CRK | FORK | FK | STREAM /.test(n)}

function hatchToPatterns(h){
 let name=String(h?.[0]||'').toLowerCase(),size=h?.[1]||'#16–20',out=[];
 const add=(pattern,why,rank)=>out.push({pattern,size,why,rank});
 if(name.includes('pmd')){add('PMD Split Case','Match PMD nymphs before the hatch',1);add("Barr's Emerger",'Strong PMD emerger when fish move up',2);add('Sparkle Dun','Use when PMD duns are clearly on top',3)}
 else if(name.includes('bwo')||name.includes('baetis')){add('RS2','Excellent BWO emerger / slim nymph profile',1);add("Barr's Emerger",'Good transition pattern during emergence',2);add('Parachute Adams','Dry-fly backup when fish are rising',3)}
 else if(name.includes('trico')){add('Rusty Spinner','Best fit for spinner falls',1);add('RS2','Tiny subsurface backup',2);add('Parachute Adams','Visible backup dry in small sizes',3)}
 else if(name.includes('callibaetis')){add('Pheasant Tail','Good Callibaetis nymph profile',1);add("Barr's Emerger",'Use as bugs move toward the surface',2);add('Sparkle Dun','Dry option when adults are present',3)}
 else if(name.includes('green drake')){add('Green Drake Nymph','Match large pre-hatch mayfly nymphs',1);add('Green Drake Parachute','Use when big duns are on the surface',2);add('Pheasant Tail','Smaller general mayfly backup',3)}
 else if(name.includes('mayfl')){add('Pheasant Tail','General mayfly nymph match',1);add('RS2','Small emerger / mayfly backup',2);add('Parachute Adams','General dry when fish are looking up',3)}
 else if(name.includes('caddis')){add('Caddis Pupa','Best first subsurface caddis match',1);add('X-Caddis','Excellent low-riding adult/emerger',2);add('Elk Hair Caddis','High-floating adult backup',3)}
 else if(name.includes('midge')){add('Zebra Midge','Reliable midge larva/pupa pattern',1);add('RS2','Excellent tiny emerger',2);add("Griffith's Gnat",'Use when adults cluster on top',3)}
 else if(name.includes('stone')||name.includes('salmon')||name.includes('golden')){add("Pat's Rubber Legs",'Start with the stonefly nymph near the bottom',1);add('Chubby Chernobyl','Buoyant adult / attractor option',2);add('Stimulator','Classic stonefly dry backup',3)}
 else if(name.includes('terrestrial')||name.includes('hopper')||name.includes('ant')||name.includes('beetle')){add('Parachute Ant','Strong small terrestrial match',1);add('Foam Beetle','Excellent bank-side terrestrial',2);add('Morrish Hopper','Use when hoppers are active',3)}

function advisorPatterns(g){
 let h=HB(g),all=[],seen=new Set();
 h.b.forEach((bug,bi)=>hatchToPatterns(bug).forEach((r,ri)=>{let key=r.pattern+'|'+r.size;if(!seen.has(key)){seen.add(key);all.push({...r,rank:bi*3+ri+1,bug:bug[0]})}}));
 // Tailwater food-base insurance that remains useful even when no hatch is visible.
 let n=(g.name||'').toUpperCase();
 if(/PROVO|GREEN RIVER NEAR GREENDALE/.test(n)){
  [['Sowbug','#16–20','Reliable tailwater food-base option'],['Zebra Midge','#20–24','Small midge insurance pattern']].forEach((x,i)=>{let key=x[0]+'|'+x[1];if(!seen.has(key)){seen.add(key);all.push({pattern:x[0],size:x[1],why:x[2],rank:20+i,bug:'Food base'})}})
 }
 let t=g.tempF,hour=new Date().getHours(),surface=(t==null||t>=50)&&(hour>=7&&hour<=20);
 // In cold water, push nymph/subsurface patterns ahead of dries. In summer evenings, lift adult/emerger options.
 all.forEach(r=>{let tags=patternTags(r.pattern);if(t!=null&&t<50&&(tags.includes('nymph')||tags.includes('larva')||tags.includes('pupa')))r.rank-=5;if(t!=null&&t<50&&tags.includes('dry'))r.rank+=7;if(surface&&hour>=17&&(tags.includes('emerger')||tags.includes('adult')||tags.includes('dry')))r.rank-=2});
 return all.sort((a,b)=>a.rank-b.rank).slice(0,8);
}
function advisorRig(g,recs){

 if(t!=null&&t>=70)return'Water is at or above 70°F. RiverFlow would not prioritize catch-and-release trout fishing here right now; check agency heat guidance before fishing.';
 if(t!=null&&t>=67)return'Water is warming. Fish early, land trout quickly, and stop if temperatures continue climbing.';
 if(t!=null&&t<50)return`Start subsurface with ${first?.pattern||'a small nymph'} and get the fly into the feeding lane before changing patterns.`;
 if(h==='Morning')return`Start with ${first?.pattern||'the top seasonal match'}. Watch for visible adults; switch toward an emerger/dry as rises become consistent.`;
 if(h==='Evening')return'Give caddis/emergers and low-riding dries extra attention near dusk, but keep a subsurface option ready if rises are inconsistent.';

}

function scoreBoxFly(f,recs){
 let score=0;
 for(let r of recs){
  let rank=Number(r.rank)||1,ft=patternTags(f.pattern),rt=patternTags(r.pattern),overlap=ft.filter(x=>rt.includes(x)).length,sizeGap=Math.abs(bugSizeNumber(f.size)-bugSizeNumber(r.size));
  let candidate=overlap*18-sizeGap*2;
  if(f.pattern===r.pattern)candidate=Math.max(candidate,108-rank*4-sizeGap*2);
  if(r.color&&r.color!=='best match'&&f.color===r.color)candidate+=5;
  score=Math.max(score,candidate);
 }
 return score;
}

async function fetchUSGSStateGauges(state){

  const cfs=Number(p.value),lng=Number(coords[0]),lat=Number(coords[1]),time=p.time||null,when=Date.parse(time||'');

  if(Number.isFinite(when)&&now-when>maxAge)continue;
  const old=by[id],oldWhen=old?Date.parse(old.time||''):NaN;if(old&&Number.isFinite(oldWhen)&&Number.isFinite(when)&&oldWhen>when)continue;

 }

}

 let featured=allMapWaters(),rivers=allLoadedRivers(),a=featured;
 if(MAP_FILTER==='still-blue')a=STILLWATERS.filter(x=>x.blue);
 else if(MAP_FILTER==='still-trophy')a=STILLWATERS.filter(x=>x.trophy);

 else if(MAP_FILTER==='river-trophy')a=rivers.filter(x=>x.trophy);
 else if(MAP_FILTER==='local')a=rivers.sort((a,b)=>(mapWaterDist(a)??1e9)-(mapWaterDist(b)??1e9)).slice(0,28);

likelyFishing=function(g){if(P[g.id])return true;let n=(' '+(g.name||'').toUpperCase().replace(/[^A-Z0-9]+/g,' ')+' ');if(/ CANAL | DRAIN | SEWAGE | FLOODWAY | SPILLBACK | WASTEWATER | OUTFALL | DITCH /.test(n))return false;return / RIVER | RIV | R | CREEK | CR | CRK | FORK | FK | STREAM /.test(n)};
friendlyGaugeName=function(name){let s=String(name||'').toLowerCase().replace(/\bcrk\b/g,'creek').replace(/\bcr\b/g,'creek').replace(/\bfk\b/g,'fork').replace(/\briv\b/g,'river').replace(/\br\b/g,'river').replace(/\bnr\b/g,'near').replace(/\babv\b/g,'above').replace(/\bblw\b/g,'below').replace(/\bbl\b/g,'below').replace(/\s+/g,' ').trim();return s.replace(/\b\w/g,c=>c.toUpperCase())};

loadOwnership=async function(force=false){
  if(!M||!OWN_LAYER)return;
  clearTimeout(OWNER_TIMER);
  if(!SHOW_OWNERSHIP){OWN_LAYER.clearLayers();setGisStatus('Ownership hidden');return}
  let z=M.getZoom();
  if(z<12&&!force){OWN_LAYER.clearLayers();setGisStatus('Zoom in for land ownership');return}
  let b=M.getBounds(),w=b.getWest(),s=b.getSouth(),e=b.getEast(),n=b.getNorth();
  if((e-w)*(n-s)>.12&&!force){OWN_LAYER.clearLayers();setGisStatus('Zoom closer for ownership detail');return}
  let req=++OWNER_REQ,isMobile=matchMedia?.('(max-width: 700px)')?.matches!==false,limit=isMobile?220:420;
  setGisStatus('Loading Utah ownership…');
  let geom=[w,s,e,n].map(x=>Number(x.toFixed(6))).join(','),offset=z>=15?(isMobile?'0.00004':'0.000025'):z>=13?(isMobile?'0.00010':'0.00007'):'0.00020';
  let u=`${LAND_OWNERSHIP_URL}/query?where=1%3D1&geometry=${encodeURIComponent(geom)}&geometryType=esriGeometryEnvelope&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=owner%2Cagency%2Cadmin%2Cdesig%2Clabel_federal%2Clabel_state%2Ccounty&returnGeometry=true&outSR=4326&geometryPrecision=5&maxAllowableOffset=${offset}&resultRecordCount=${limit}&f=geojson`;
  try{
    let r=await fetch(u,{cache:'no-store'}),j=await r.json();if(req!==OWNER_REQ)return;if(!r.ok||j.error)throw Error(j.error?.message||`GIS ${r.status}`);
    OWN_LAYER.clearLayers();RF_MAP_RENDERER=RF_MAP_RENDERER||L.canvas({padding:.28,tolerance:14});
    L.geoJSON(j,{style:f=>({...ownerStyle(f.properties?.owner),renderer:RF_MAP_RENDERER,interactive:false})}).addTo(OWN_LAYER);
    let count=j.features?.length||0;setGisStatus(`${count} ownership areas in view${count>=limit?' · zoom closer for more detail':''}`)
  }catch(err){if(req!==OWNER_REQ)return;OWN_LAYER.clearLayers();setGisStatus('Ownership layer unavailable — map still usable',true);console.warn('RiverFlow GIS',err)}
};

    name:'Lower Provo River', rawName:'Lower Provo River · Deer Creek tailwater / Provo Canyon',

const RF_GAUGE_RIVERS_V172 = allLoadedRivers;
allLoadedRivers = function(){
  const gauges = RF_GAUGE_RIVERS_V172();

  return gauges.concat(RF_NAMED_RIVER_REACHES.filter(x=>!ids.has(x.id)).map(x=>({...x})));
};
allSearchWaters = function(){ return [...STILLWATERS, ...allLoadedRivers()]; };

const RF_SEARCH_HAY_V172 = searchHay;
searchHay = function(x){
  return (RF_SEARCH_HAY_V172(x)+' '+((x.aliases||[]).join(' '))).toLowerCase();
};

function rfNormRiver(n){return String(n||'').toLowerCase().replace(/\b(the|upper|middle|lower|north|south|east|west|fork|river|creek)\b/g,' ').replace(/[^a-z0-9]+/g,' ').trim()}
function rfAccessSpots(w){if(!w||!Array.isArray(WADE_ACCESS))return[];let full=`${w.name||''} ${w.rawName||''}`.toLowerCase(),exact=WADE_ACCESS.filter(a=>full.includes(a.river.toLowerCase())||a.river.toLowerCase().includes((w.name||'').toLowerCase()));let arr=exact.length?exact:WADE_ACCESS.filter(a=>{let an=rfNormRiver(a.river),wn=rfNormRiver(w.name||w.rawName);return an&&wn&&(an===wn||an.includes(wn)||wn.includes(an))});return arr.map(a=>({...a,_mi:Number.isFinite(+w.lat)&&Number.isFinite(+w.lng)?Math.round(hav(+w.lat,+w.lng,+a.lat,+a.lng)*10)/10:null})).sort((a,b)=>(a._mi??999)-(b._mi??999))}
function rfAccessRows(spots,limit=99){return spots.slice(0,limit).map(a=>`<div class="rfAccessSpot"><div><h4>${E(a.name)}</h4><p>${E(a.kind)}${a._mi!=null?` · ${a._mi} mi from selected point`:''}</p><div class="rfAccessMeta">${a.parking?'<span>🅿 Parking</span>':''}${a.walk?'<span>🥾 Walk-in</span>':''}${a.accessible?'<span>♿ Accessible</span>':''}</div></div><div class="rfAccessActions"><button class="mapIt" data-rfaccess-map="${E(a.id)}">Map</button><a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${+a.lat},${+a.lng}">Directions ↗</a></div></div>`).join('')}
function rfAccessPreview(w){let spots=rfAccessSpots(w);if(!spots.length)return'';return`<div class="rfPanel"><div class="rfAccessHead"><div><span class="k">Access spots</span><h3>${spots.length} mapped ${spots.length===1?'approach':'approaches'}</h3></div><button data-rfsheet-jump="access">View all →</button></div><div class="rfAccessList">${rfAccessRows(spots,3)}</div></div>`}
function rfDismissSheet(){let sh=$('#rfRiverSheet');if(sh){sh.classList.remove('dragging');sh.classList.add('closing');setTimeout(()=>{MAP_SELECTED=null;RF_SHEET_TAB='overview';RF_SHEET_PEEK=false;renderSelectionHost();renderAccessLayer()},170)}else{MAP_SELECTED=null;RF_SHEET_TAB='overview';RF_SHEET_PEEK=false;renderSelectionHost();renderAccessLayer()}}
function rfSheetBadges(w,p){let a=[];if(w.blue||p?.blue)a.push('<span class="rfInfoBadge">◆ Blue Ribbon</span>');if(w.current20)a.push('<span class="rfInfoBadge gold">20+ current evidence</span>');else if((w.verifiedInches||0)>=20)a.push(`<span class="rfInfoBadge gold">${Math.round(w.verifiedInches)}&quot; verified</span>`);if(w.trophy||p?.trophy>=4)a.push('<span class="rfInfoBadge gold">★ Big Fish potential</span>');if(w.kind==='nhd')a.push('<span class="rfInfoBadge purple">Named stream only</span>');return a.join('')}
function rfSheetReport(g){if(!g)return'';try{let r=report(g);if(!r)return'';let rs=reportState(r);return`<div class="rfPanel"><div class="rfPanelTop"><div><span class="k">Fishing report</span><h3>${E(r.source)}</h3></div><span class="rfInfoBadge">${E(rs.label)}</span></div><p>${E(r.summary)}</p>${r.url?`<a class="rfPanelLink" target="_blank" href="${E(r.url)}">Read source report ↗</a>`:''}</div>`}catch{return''}}
function rfSheetOverview(w,g,p){let d=rfSheetDistance(w),h=g?HB(g):null;return`<div class="rfHeroStats"><div class="rfHeroStat"><span>RiverFlow</span><b>${w.score|| (g?SCORE(g).n:'—')}</b><small>condition score</small></div><div class="rfHeroStat"><span>Flow</span><b>${w.cfs!=null?N(w.cfs):g?.cfs!=null?N(g.cfs):'—'}</b><small>${w.cfs!=null||g?.cfs!=null?'CFS live':'no live gauge'}</small></div><div class="rfHeroStat"><span>Water</span><b>${w.tempF!=null?Math.round(w.tempF)+'°':g?.tempF!=null?Math.round(g.tempF)+'°':'—'}</b><small>${d!=null?d+' mi away':'temperature'}</small></div></div><div class="rfBadgeRow">${rfSheetBadges(w,p)}</div><div class="rfPanel"><span class="k">Overview</span><h3>${E(p?.title||w.name)}</h3><p>${E(w.note||p?.why||'RiverFlow has mapped this water. Live conditions and verified fishing intelligence appear when a trusted source is attached.')}</p>${w.source?`<div class="rfMiniRows"><div class="rfMiniRow"><span>Primary source</span><b>${E(w.source)}</b></div>${p?.typical?`<div class="rfMiniRow"><span>Typical fish class</span><b>${E(p.typical)}</b></div>`:''}${p?.plus?`<div class="rfMiniRow"><span>Big-fish evidence</span><b>${E(p.plus)}</b></div>`:''}</div>`:''}</div>${rfSheetReport(g)}${rfAccessPreview(w)}${h?`<div class="rfPanel"><span class="k">Bug snapshot</span><h3>Likely food right now</h3><div class="rfBugList">${h.b.slice(0,4).map(x=>`<div class="rfBugLine"><b>${E(x[0])}</b><span>${E(x[1])} · ${E(x[2])}</span></div>`).join('')}</div></div>`:''}`}
function rfSheetConditions(w,g){let cfs=w.cfs??g?.cfs,temp=w.tempF??g?.tempF;return`<div class="rfConditionGrid"><div class="rfConditionCard"><span>CURRENT FLOW</span><b>${cfs!=null?N(cfs):'—'} ${cfs!=null?'<small>CFS</small>':''}</b><small>${g?.time?AGE(g.time):'Live source when available'}</small></div><div class="rfConditionCard"><span>WATER TEMP</span><b>${temp!=null?Math.round(temp)+'°F':'—'}</b><small>${temp==null?'Not reported':temp>=67?'Warm — use caution':'Trout-safe range depends on species/reach'}</small></div></div><div class="rfPanel"><span class="k">7-day flow</span><h3>Recent discharge</h3><div id="rfSheetHistory" class="rfSheetLoading">Loading flow history…</div></div><div class="rfPanel"><span class="k">Weather</span><h3>At this river</h3><div id="rfSheetWeather" class="rfSheetLoading">Loading forecast…</div></div>`}
function rfSheetSpecies(w,g,p){let parts=rfSpeciesParts(w,g,p),h=g?HB(g):null;return`<div class="rfPanel"><span class="k">Fish species</span><h3>What lives here</h3>${parts.length?`<div class="rfSpeciesGrid">${parts.map(x=>`<span class="rfSpeciesPill">${E(x)}</span>`).join('')}</div>`:'<p>RiverFlow does not have a verified species list attached to this named stream yet.</p>'}</div>${p?`<div class="rfPanel"><span class="k">Fishery profile</span><h3>${p.trophy>=4?'Big-fish opportunity':'Fishing profile'}</h3><p>${E(p.why||'')}</p><div class="rfMiniRows">${p.typical?`<div class="rfMiniRow"><span>Typical class</span><b>${E(p.typical)}</b></div>`:''}${p.trophySeason?`<div class="rfMiniRow"><span>Best big-fish season</span><b>${E(p.trophySeason)}</b></div>`:''}${p.confidence?`<div class="rfMiniRow"><span>Evidence confidence</span><b>${E(p.confidence)}</b></div>`:''}</div></div>`:''}${h?`<div class="rfPanel"><span class="k">Food base</span><h3>What they may be eating</h3><div class="rfSpeciesGrid">${h.food.map(x=>`<span class="rfSpeciesPill">${E(x)}</span>`).join('')}</div></div>`:''}`}
function rfSheetAccess(w,g){let official=w.externalIntelUrl||(g?`https://waterdata.usgs.gov/monitoring-location/USGS-${g.id}/`:null),spots=rfAccessSpots(w);return`${spots.length?`<div class="rfPanel"><div class="rfAccessHead"><div><span class="k">Mapped access spots</span><h3>${spots.length} ${spots.length===1?'approach':'approaches'} on this river</h3></div></div><p>Tap Map to drop the sheet and center that access point, or use Directions to navigate there.</p><div class="rfAccessList">${rfAccessRows(spots)}</div></div>`:`<div class="rfPanel"><span class="k">Mapped access spots</span><h3>No verified spots attached yet</h3><p>We have not attached a specific RiverFlow access point to this water yet. That does not mean public access is unavailable.</p></div>`}<div class="rfPanel"><span class="k">Access & navigation</span><h3>River information & sources</h3><p>RiverFlow keeps land ownership and legal fishing/wading access separate. Public ownership does not automatically mean you can cross private land or wade a reach.</p><div class="rfActionStack"><a class="primary" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${+w.lat},${+w.lng}">Directions to selected river ↗</a>${official?`<a target="_blank" href="${E(official)}">${w.externalIntelLabel?E(w.externalIntelLabel):g?'Official USGS gauge':'Official source'} ↗</a>`:''}${w.id==='reach-lower-provo'?`<a target="_blank" href="${RF_LOWER_PROVO_FLOW_URL}">Official Lower Provo CUWCD flow ↗</a>`:''}</div><div class="rfLegal">Always verify posted signs, closures, current fishing regulations and access rules before entering a property or water.</div></div>${SHOW_OWNERSHIP?'<div class="rfPanel"><span class="k">Land layer</span><h3>Ownership layer is on</h3><p>Use the map polygons as a navigation aid only. They do not establish legal stream access.</p></div>':''}`}

function rfRiverSheet(w){if(!w)return'';let g=rfSheetGauge(w),p=rfSheetProfile(w,g),tab=RF_SHEET_TAB,ac=rfAccessSpots(w).length;let body=tab==='conditions'?rfSheetConditions(w,g):tab==='species'?rfSheetSpecies(w,g,p):tab==='access'?rfSheetAccess(w,g):rfSheetOverview(w,g,p);return`<section class="rfRiverSheet ${RF_SHEET_PEEK?'peek':''}" id="rfRiverSheet"><div class="rfSheetGrab" id="rfSheetGrab" aria-label="Drag river details"></div><div class="rfSwipeHint">Swipe down to return to the map</div><div class="rfSheetHeader"><div><div class="rfSheetEyebrow"><span>${E(w.state||'')} · ${w.type==='stillwater'?'Stillwater':'River'}</span>${w.blue?'<span>◆ Blue Ribbon</span>':''}${w.trophy?'<span>★ Big Fish</span>':''}</div><h2>${E(p?.title||w.name)}</h2><p>${g?`${E(g.name)} · ${AGE(g.time)}`:E(w.rawName||w.species||'Named fishing water')}</p></div><div class="rfSheetHeadActions"><button id="rfSheetShare" aria-label="Share">↗</button><button id="rfSheetClose" aria-label="Close">×</button></div></div><div class="rfSheetTabs">${[['overview','Overview'],['conditions','Conditions'],['species','Species'],['access',ac?`Access · ${ac}`:'Access']].map(x=>`<button data-rfsheet-tab="${x[0]}" class="${tab===x[0]?'on':''}">${x[1]}</button>`).join('')}</div><div class="rfSheetScroll" id="rfSheetScroll">${body}</div></section>`}

const RF_OLD_MAP_CARD_V2=mapSelectionCard;
mapSelectionCard=function(){return MAP_SELECTED?rfRiverSheet(MAP_SELECTED):''};
const RF_OLD_WIRE_SELECTION_V2=wireMapSelection;
wireMapSelection=function(){try{RF_OLD_WIRE_SELECTION_V2()}catch{}rfWireRiverSheet()};
renderSelectionHost=function(){let h=$('#mapSelectionHost');if(!h)return;h.innerHTML=MAP_SELECTED?rfRiverSheet(MAP_SELECTED):'';rfWireRiverSheet()};
function rfWireRiverSheet(){let sh=$('#rfRiverSheet');if(!sh)return;$('#rfSheetClose')?.addEventListener('click',rfDismissSheet);document.querySelectorAll('[data-rfsheet-tab]').forEach(b=>b.onclick=()=>{RF_SHEET_TAB=b.dataset.rfsheetTab;RF_SHEET_PEEK=false;renderSelectionHost()});document.querySelectorAll('[data-rfsheet-jump]').forEach(b=>b.onclick=()=>{RF_SHEET_TAB=b.dataset.rfsheetJump;RF_SHEET_PEEK=false;renderSelectionHost()});document.querySelectorAll('[data-rfaccess-map]').forEach(b=>b.onclick=()=>{let a=WADE_ACCESS.find(x=>x.id===b.dataset.rfaccessMap);if(!a)return;let lat=+a.lat,lng=+a.lng;MAP_SELECTED=null;RF_SHEET_TAB='overview';RF_SHEET_PEEK=false;renderSelectionHost();SHOW_ACCESS=true;renderAccessLayer();if(M){M.setView([lat,lng],14,{animate:true});setTimeout(()=>{ACCESS_LAYER?.eachLayer?.(l=>{let ll=l.getLatLng?.();if(ll&&Math.abs(ll.lat-lat)<.00001&&Math.abs(ll.lng-lng)<.00001)l.openTooltip?.()})},300)}});$('#rfSheetShare')?.addEventListener('click',async()=>{let w=MAP_SELECTED;if(!w)return;let txt=`${w.name} — RiverFlow`;let url=`https://www.google.com/maps/search/?api=1&query=${w.lat},${w.lng}`;try{if(navigator.share)await navigator.share({title:w.name,text:txt,url});else{await navigator.clipboard.writeText(url);rfLocationNotice?.('River location copied','good')}}catch{}});let grab=$('#rfSheetGrab');if(grab){grab.onclick=()=>{RF_SHEET_PEEK=!RF_SHEET_PEEK;sh.classList.toggle('peek',RF_SHEET_PEEK)}}let scroll=$('#rfSheetScroll');sh.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;RF_SHEET_TOUCH_Y=e.touches[0].clientY;RF_SHEET_TOUCH_X=e.touches[0].clientX;RF_SHEET_START_SCROLL=scroll?.scrollTop||0;RF_SHEET_DRAG=false;sh.style.transform=''}, {passive:true});sh.addEventListener('touchmove',e=>{if(e.touches.length!==1||RF_SHEET_START_SCROLL>1)return;let dy=e.touches[0].clientY-RF_SHEET_TOUCH_Y,dx=e.touches[0].clientX-RF_SHEET_TOUCH_X;if(dy>5&&Math.abs(dy)>Math.abs(dx)*1.1){RF_SHEET_DRAG=true;e.preventDefault();sh.classList.add('dragging');sh.style.transform=`translateY(${Math.min(320,dy)}px)`}}, {passive:false});sh.addEventListener('touchend',e=>{if(!RF_SHEET_DRAG)return;let dy=e.changedTouches[0].clientY-RF_SHEET_TOUCH_Y;sh.classList.remove('dragging');sh.style.transform='';RF_SHEET_DRAG=false;if(dy>85)rfDismissSheet()}, {passive:true});if(RF_SHEET_TAB==='conditions')setTimeout(rfLoadSheetConditions,20)}

async function rfLoadSheetConditions(){let w=MAP_SELECTED,g=rfSheetGauge(w);if(!w)return;let hh=$('#rfSheetHistory'),ww=$('#rfSheetWeather');if(hh){if(!g){hh.innerHTML='<div class="rfSheetLoading">No live gauge is attached to this named reach.</div>'}else try{let r=await fetch(`https://riverflow-v2-history.vercel.app/api/history?site=${encodeURIComponent(g.id)}&days=7`),j=await r.json(),pts=j.points||[];if(!pts.length)throw 0;let vals=pts.map(x=>+x.value).filter(Number.isFinite),mn=Math.min(...vals),mx=Math.max(...vals),rng=mx-mn||1,path=pts.map((x,i)=>`${i?'L':'M'} ${5+i/(pts.length-1||1)*290} ${125-(+x.value-mn)/rng*110}`).join(' '),fill=path+` L 295 135 L 5 135 Z`;hh.className='';hh.innerHTML=`<div class="rfChartBox"><svg viewBox="0 0 300 140" preserveAspectRatio="none"><path class="rfChartFill" d="${fill}"/><path class="rfChartLine" d="${path}"/></svg></div><div class="rfChartMeta"><span>${Math.round(mn)}–${Math.round(mx)} CFS</span><span>7 days</span></div>`}catch{hh.innerHTML='<div class="rfSheetLoading">Flow history unavailable right now.</div>'}}if(ww)try{let r=await fetch(`https://riverflow-v2-weather.vercel.app/api/weather?lat=${+w.lat}&lng=${+w.lng}`),j=await r.json(),days=(j.days||[]).slice(0,3);if(!days.length)throw 0;ww.className='';ww.innerHTML=`<div class="rfWeatherDays">${days.map(d=>`<div class="rfWeatherDay"><b>${E(d.name)}</b><strong>${d.high??'—'}°</strong><small>${E(d.forecast||'')}${d.precip!=null?` · ${d.precip}% rain`:''}</small></div>`).join('')}</div>`}catch{ww.innerHTML='<div class="rfSheetLoading">Weather forecast unavailable right now.</div>'}}
try{document.title='RiverFlow — River Detail v2 Prototype'}catch{}
</script>

<script>
/* RiverFlow River Detail v2.1 — faster tiles, distinct rivers, gold Blue Ribbon lines,
   and generous whole-line tapping. Prototype only. */
const RF_RIVER_NORMAL_COLOR='#078fa5';
const RF_RIVER_BLUE_COLOR='#d5a21f';
const RF_RIVER_SELECTED_COLOR='#075f6c';
let RF_NHD_LAST_KEY='',RF_NHD_LAST_DATA=null;

function rfStateAtPoint(lat,lng){
  for(const st of ['UT','WY','ID','MT']){
    let b=RF_STATE_BOUNDS?.[st];if(!b)continue;
    let south=b[0][0],west=b[0][1],north=b[1][0],east=b[1][1];
    if(lat>=south&&lat<=north&&lng>=west&&lng<=east)return st;
  }
  return MAP_STATE==='ALL'?'':MAP_STATE;
}
function rfRiverCatalogMatch(name,lat,lng,stateHint=''){
  let key=rfNormRiver(name);if(!key)return null;
  let a=allLoadedRivers().filter(w=>{
    if(w.type!=='river')return false;
    if(stateHint&&w.state&&w.state!==stateHint)return false;
    let wk=rfNormRiver(w.name||w.rawName||'');
    return wk&&(wk===key||wk.includes(key)||key.includes(wk));
  });
  if(!a.length)return null;
  if(Number.isFinite(lat)&&Number.isFinite(lng)){
    a.sort((x,y)=>(hav(lat,lng,+x.lat,+x.lng)||99999)-(hav(lat,lng,+y.lat,+y.lng)||99999));
  }else a.sort((x,y)=>bScore(y)-bScore(x));
  return a[0]||null;
}
function rfNhdMeta(f){
  let n=f?.properties?.gnis_name||f?.properties?.GNIS_NAME||'';
  let c=rfNhdCenter(f?.geometry),st=c?rfStateAtPoint(c.lat,c.lng):(MAP_STATE==='ALL'?'':MAP_STATE);
  let w=n&&c?rfRiverCatalogMatch(n,c.lat,c.lng,st):null;
  return {name:n,center:c,state:st,water:w,blue:!!(n&&c&&rfBlueReachNear(n,c,st))};
}
function rfOpenRiverLine(f,latlng){
  let n=f?.properties?.gnis_name||f?.properties?.GNIS_NAME||'';if(!n)return;
  let lat=+latlng?.lat,lng=+latlng?.lng,st=rfStateAtPoint(lat,lng);
  let w=rfRiverCatalogMatch(n,lat,lng,st);
  if(w){
    // Preserve all curated/live intelligence, but make this river stretch the selected location.
    MAP_SELECTED={...w,lat,lng,_catalogLat:w.lat,_catalogLng:w.lng,_riverLineTap:true};
  }else{
    MAP_SELECTED={
      id:'nhd-'+(f.properties?.reachcode||n)+'-'+lat.toFixed(4)+'-'+lng.toFixed(4),
      kind:'nhd',type:'river',state:st,name:n,rawName:n,lat,lng,
      blue:false,trophy:false,current20:false,verifiedInches:null,highElevation:false,gem:false,score:0,
      species:'Named stream / river',
      note:'USGS National Hydrography Dataset named stream. Live flow, trophy evidence and legal access are shown only when RiverFlow has separate verified data.',
      source:'USGS National Hydrography Dataset'
    };
  }
  RF_SHEET_TAB='overview';RF_SHEET_PEEK=false;
  renderSelectionHost();renderAccessLayer();scheduleOwnership();
}
function rfNhdViewportKey(z,b){
  let c=b.getCenter(),spanLat=b.getNorth()-b.getSouth(),spanLng=b.getEast()-b.getWest();
  return [Math.floor(z),c.lat.toFixed(2),c.lng.toFixed(2),spanLat.toFixed(2),spanLng.toFixed(2)].join('|');
}
function rfDrawNhdData(j,z){
  if(!RF_NHD_LAYER||!j)return;
  RF_NHD_LAYER.clearLayers();
  let metaCache=new WeakMap();
  const meta=f=>{let m=metaCache.get(f);if(!m){m=rfNhdMeta(f);metaCache.set(f,m)}return m};
  L.geoJSON(j,{
    renderer:RF_MAP_RENDERER||undefined,
    style:f=>{
      let m=meta(f),selected=!!(MAP_SELECTED&&m.water&&MAP_SELECTED.id===m.water.id);
      return{
        color:selected?RF_RIVER_SELECTED_COLOR:(m.blue?RF_RIVER_BLUE_COLOR:RF_RIVER_NORMAL_COLOR),
        weight:selected?5.4:(m.blue?(z>=12?4.4:3.7):(z>=12?3.4:2.8)),
        opacity:selected?1:(m.blue?.96:.88),
        interactive:true
      };
    },
    onEachFeature:(f,l)=>{
      let m=meta(f);if(!m.name)return;
      let label=`<b>${E(m.name)}</b>${m.blue?'<br>◆ Blue Ribbon':''}`;
      if(z>=10)l.bindTooltip(label,{sticky:true,className:'rfLabel'});
      l.on('click',e=>rfOpenRiverLine(f,e.latlng));
    }
  }).addTo(RF_NHD_LAYER);
}
rfNhdSchedule=function(){
  clearTimeout(RF_NHD_TIMER);
  RF_NHD_TIMER=setTimeout(rfLoadNhdViewport,180);
};
rfLoadNhdViewport=async function(){
  if(!M||!RF_NHD_LAYER)return;let z=M.getZoom();
  if(z<9||!rfFilterOn('rivers')){RF_NHD_LAYER.clearLayers();return}
  let b=M.getBounds(),area=(b.getEast()-b.getWest())*(b.getNorth()-b.getSouth());
  let maxArea=z>=11?1.55:z>=10?2.45:3.2;
  if(area>maxArea){RF_NHD_LAYER.clearLayers();return}
  let key=rfNhdViewportKey(z,b);
  if(key===RF_NHD_LAST_KEY&&RF_NHD_LAST_DATA){rfDrawNhdData(RF_NHD_LAST_DATA,z);return}
  let req=++RF_NHD_REQ,mobile=matchMedia?.('(max-width:700px)')?.matches!==false;
  let cap=mobile?(z>=13?360:z>=11?280:190):(z>=13?700:z>=11?520:340);
  let geom=[b.getWest(),b.getSouth(),b.getEast(),b.getNorth()].map(v=>+v.toFixed(6)).join(',');
  let off=z>=14?'0.00002':z>=12?'0.000055':z>=10?'0.00011':'0.0002';
  let u=`${RF_NHD_FLOW}/query?where=${encodeURIComponent("ftype=460 AND gnis_name IS NOT NULL")}&geometry=${encodeURIComponent(geom)}&geometryType=esriGeometryEnvelope&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=gnis_name,reachcode,fcode,lengthkm&returnGeometry=true&outSR=4326&geometryPrecision=5&maxAllowableOffset=${off}&resultRecordCount=${cap}&f=geojson`;
  try{
    let r=await fetch(u,{cache:'force-cache'}),j=await r.json();
    if(req!==RF_NHD_REQ)return;
    if(!r.ok||j.error)throw Error(j.error?.message||`NHD ${r.status}`);
    RF_NHD_LAST_KEY=key;RF_NHD_LAST_DATA=j;
    rfDrawNhdData(j,z);
  }catch(e){
    // Keep the already-drawn river lines instead of blanking the overlay during a slow request.

<script>
/* RiverFlow Explore v2.2
   Important fishing rivers remain visually pronounced at state-scale zoom.
   Detailed NHD tributaries still fade in closer. */
const RF_MAJOR_RIVER_NAMES={
 UT:[
  'Provo River','Green River','Weber River','Duchesne River','Strawberry River',
  'Bear River','Logan River','Sevier River','Price River','Huntington Creek'
 ],
 WY:[
  'Green River','Snake River','North Platte River','Bighorn River','Shoshone River',
  'Wind River','New Fork River','Salt River','Hoback River','Encampment River'
 ],
 ID:[
  'Snake River','Henrys Fork','Boise River','St. Joe River','Salmon River',
  'Clearwater River','Big Lost River','Big Wood River','Teton River','Payette River'
 ],
 MT:[
  'Madison River','Yellowstone River','Missouri River','Gallatin River','Big Hole River',
  'Beaverhead River','Bighorn River','Bitterroot River','Blackfoot River','Clark Fork',
  'Flathead River','Rock Creek','Ruby River','Kootenai River'
 ]
};
let RF_MAJOR_LAYER=null,RF_MAJOR_OUTLINE_LAYER=null,RF_MAJOR_STAR_LAYER=null;
const RF_MAJOR_CACHE=new Map(),RF_MAJOR_LOADING=new Map();
let RF_MAJOR_RENDERER=null,RF_MAJOR_OUTLINE_RENDERER=null;

function rfSqlQuote(s){return "'"+String(s).replace(/'/g,"''")+"'";}
function rfMajorNames(st){return RF_MAJOR_RIVER_NAMES[st]||[]}
function rfSavedWater(w){
  if(!w)return false;
  let ids=[w.id,w.gaugeId,w.site,w.siteNo].filter(Boolean).map(String);
  return ids.some(id=>F.includes(id));
}
function rfBlueReachNear(name,c,st){
  if(!c)return null;
  let key=rfNormRiver(name),a=allLoadedRivers().filter(w=>{
    if(!w.blue||w.state!==st)return false;
    let wk=rfNormRiver(w.name||w.rawName||'');
    return wk&&(wk===key||wk.includes(key)||key.includes(wk));
  });
  if(!a.length)return null;
  a.sort((x,y)=>(hav(c.lat,c.lng,+x.lat,+x.lng)||99999)-(hav(c.lat,c.lng,+y.lat,+y.lng)||99999));
  let d=hav(c.lat,c.lng,+a[0].lat,+a[0].lng);
  // Blue Ribbon is reach-specific. Gold only the nearby NHD segments.
  return Number.isFinite(d)&&d<=55?a[0]:null;
}
function rfMajorMeta(f,st){
  let name=f?.properties?.gnis_name||f?.properties?.GNIS_NAME||'';
  let c=rfNhdCenter(f?.geometry),water=c?rfRiverCatalogMatch(name,c.lat,c.lng,st):null;
  let blue=rfBlueReachNear(name,c,st);
  return{name,center:c,state:st,water,blue:!!blue,saved:rfSavedWater(water)};
}
async function rfFetchMajorState(st){
  if(RF_MAJOR_CACHE.has(st))return RF_MAJOR_CACHE.get(st);
  if(RF_MAJOR_LOADING.has(st))return RF_MAJOR_LOADING.get(st);
  let p=(async()=>{
    let names=rfMajorNames(st);if(!names.length)return{type:'FeatureCollection',features:[]};
    let bb=RF_STATE_BOUNDS[st];
    let where=`ftype=460 AND gnis_name IN (${names.map(rfSqlQuote).join(',')})`;
    let geom=[bb[0][1],bb[0][0],bb[1][1],bb[1][0]].join(',');
    let u=`${RF_NHD_FLOW}/query?where=${encodeURIComponent(where)}&geometry=${encodeURIComponent(geom)}&geometryType=esriGeometryEnvelope&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=gnis_name,reachcode,lengthkm&returnGeometry=true&outSR=4326&geometryPrecision=4&maxAllowableOffset=0.00045&resultRecordCount=2000&f=geojson`;
    try{
      let r=await fetch(u,{cache:'force-cache'}),j=await r.json();
      if(!r.ok||j.error)throw Error(j.error?.message||`Major rivers ${r.status}`);
      RF_MAJOR_CACHE.set(st,j);return j;
    }catch(e){
      console.warn('RiverFlow major fishery network',st,e);
      let empty={type:'FeatureCollection',features:[]};RF_MAJOR_CACHE.set(st,empty);return empty;
    }finally{RF_MAJOR_LOADING.delete(st)}
  })();
  RF_MAJOR_LOADING.set(st,p);return p;
}
function rfMajorFeatureState(f){
  let c=rfNhdCenter(f.geometry);return c?rfStateAtPoint(c.lat,c.lng):(MAP_STATE==='ALL'?'UT':MAP_STATE)
}
function rfMajorWidth(z,blue=false){
  if(z<=5.5)return blue?5.8:5.1;
  if(z<=6.5)return blue?6.0:5.3;
  if(z<=7.5)return blue?5.6:4.9;
  if(z<=8.5)return blue?5.2:4.5;
  if(z<=9.5)return blue?4.8:4.0;
  return blue?4.1:3.5;
}
function rfMajorOutlineWidth(z,blue=false){return rfMajorWidth(z,blue)+3.0}
function rfMajorColor(m){return m.blue?RF_RIVER_BLUE_COLOR:RF_RIVER_NORMAL_COLOR}
function rfMajorOutlineColor(m){return m.blue?'#6f5510':'#07505f'}
function rfMajorVisibleStates(){
  if(MAP_STATE&&MAP_STATE!=='ALL')return[MAP_STATE];
  if(!M)return['UT'];
  let b=M.getBounds();
  return['UT','WY','ID','MT'].filter(st=>{
    let x=RF_STATE_BOUNDS[st];
    let sw=L.latLng(x[0][0],x[0][1]),ne=L.latLng(x[1][0],x[1][1]);
    return b.intersects(L.latLngBounds(sw,ne));
  });
}
function rfMajorRepresentativeFeatures(features,st){
  let best=new Map();
  for(let f of features){
    let n=f?.properties?.gnis_name||'';if(!n)continue;
    let c=rfNhdCenter(f.geometry);if(!c)continue;
    let cur=best.get(n),score=Number(f.properties?.lengthkm)||0;
    // Prefer a segment near the state center for a stable label/spot anchor.
    let bb=RF_STATE_BOUNDS[st],sc={lat:(bb[0][0]+bb[1][0])/2,lng:(bb[0][1]+bb[1][1])/2};
    let centerBonus=Math.max(0,100-(hav(c.lat,c.lng,sc.lat,sc.lng)||100));
    let rank=score+centerBonus*.08;
    if(!cur||rank>cur.rank)best.set(n,{f,c,rank});
  }
  return best;
}
async function rfRenderMajorRivers(){
  if(!M||!RF_MAJOR_LAYER||!RF_MAJOR_OUTLINE_LAYER)return;
  let z=M.getZoom();
  if(z>10.75||!rfFilterOn('rivers')){
    RF_MAJOR_LAYER.clearLayers();RF_MAJOR_OUTLINE_LAYER.clearLayers();RF_MAJOR_STAR_LAYER?.clearLayers();return;
  }
  let states=rfMajorVisibleStates(),parts=await Promise.all(states.map(async st=>({st,j:await rfFetchMajorState(st)})));
  if(!M||M.getZoom()>10.75)return;
  RF_MAJOR_LAYER.clearLayers();RF_MAJOR_OUTLINE_LAYER.clearLayers();RF_MAJOR_STAR_LAYER?.clearLayers();
  for(let {st,j} of parts){
    if(!j?.features?.length)continue;
    let cache=new WeakMap(),meta=f=>{let m=cache.get(f);if(!m){m=rfMajorMeta(f,st);cache.set(f,m)}return m};
    L.geoJSON(j,{
      renderer:RF_MAJOR_OUTLINE_RENDERER||RF_MAP_RENDERER||undefined,
      pane:'rfMajorOutline',
      style:f=>{let m=meta(f);return{color:rfMajorOutlineColor(m),weight:rfMajorOutlineWidth(z,m.blue),opacity:.58,interactive:false,lineCap:'round',lineJoin:'round'}}
    }).addTo(RF_MAJOR_OUTLINE_LAYER);
    L.geoJSON(j,{
      renderer:RF_MAJOR_RENDERER||RF_MAP_RENDERER||undefined,
      pane:'rfMajorLines',
      style:f=>{
        let m=meta(f),selected=!!(MAP_SELECTED&&m.water&&MAP_SELECTED.id===m.water.id);
        return{color:selected?RF_RIVER_SELECTED_COLOR:rfMajorColor(m),weight:selected?rfMajorWidth(z,m.blue)+1.5:rfMajorWidth(z,m.blue),opacity:.98,interactive:true,lineCap:'round',lineJoin:'round'};
      },
      onEachFeature:(f,l)=>{
        let m=meta(f);if(!m.name)return;
        l.on('click',e=>rfOpenRiverLine(f,e.latlng));
        if(z>=7.1&&z<=9.7)l.bindTooltip(`${m.blue?'◆ ':''}${E(m.name)}`,{sticky:true,className:'rfMajorLabel'});
      }
    }).addTo(RF_MAJOR_LAYER);

    // One always-visible saved/main-spot star per favorited major river.
    let reps=rfMajorRepresentativeFeatures(j.features,st);
    for(let [name,o] of reps){
      let w=rfRiverCatalogMatch(name,o.c.lat,o.c.lng,st);if(!rfSavedWater(w))continue;
      let icon=L.divIcon({className:'',html:'<div class="rfSavedRiverStar">★</div>',iconSize:[24,24],iconAnchor:[12,12]});
      L.marker([o.c.lat,o.c.lng],{icon,pane:'markerPane',keyboard:false})
       .addTo(RF_MAJOR_STAR_LAYER)
       .bindTooltip(`Saved · ${E(name)}`,{direction:'top'})
       .on('click',()=>{MAP_SELECTED={...w,lat:o.c.lat,lng:o.c.lng,_riverLineTap:true};RF_SHEET_TAB='overview';RF_SHEET_PEEK=false;renderSelectionHost();renderAccessLayer()});
    }
  }
}
function rfMajorSchedule(){
  clearTimeout(rfMajorSchedule.t);
  rfMajorSchedule.t=setTimeout(rfRenderMajorRivers,110);
}

// Keep the detailed tributary network quiet until closer zoom.
// Major fishery corridors handle state-scale exploration.
const RF_NHD_LOAD_MAJOR_BASE=rfLoadNhdViewport;
rfLoadNhdViewport=async function(){

<style id="rf-major-stability-style">
/* v2.3 stable: one lightweight label per major river, no duplicate geometry halo */
.rfMajorStaticLabel{
  background:rgba(255,255,255,.92)!important;
  border:1px solid rgba(171,191,187,.72)!important;

</style>
<script>
/* RiverFlow Explore v2.3 STABLE
   Performance changes:
   - State-wide NHD segments are compacted into one MultiLineString per river/color.
   - Major river geometry is cached once per state.
   - No second full outline copy of every river.
   - Panning inside the same state set does not rebuild the network.
   - Detailed NHD tributaries wait until close zoom, avoiding double rendering.
*/
(function(){
  const lowMemory = matchMedia?.('(max-width:700px)')?.matches !== false ||
                    (navigator.deviceMemory && navigator.deviceMemory <= 4);
  let stableCache = new Map();
  let stableLoading = new Map();
  let drawKey = '';
  let renderToken = 0;
  let labelLayer = null;

  // Do not reuse the heavy raw state cache from the previous prototype.
  try{ RF_MAJOR_CACHE.clear(); RF_MAJOR_LOADING.clear(); }catch{}

  function linesFromGeometry(g){
    if(!g)return[];
    if(g.type==='LineString')return Array.isArray(g.coordinates)?[g.coordinates]:[];
    if(g.type==='MultiLineString')return Array.isArray(g.coordinates)?g.coordinates:[];
    if(g.type==='GeometryCollection')return (g.geometries||[]).flatMap(linesFromGeometry);
    return[];
  }

  function stableBlueForSegment(name,f,st){
    let c=rfNhdCenter(f.geometry);
    return !!rfBlueReachNear(name,c,st);
  }

  function compactMajorGeoJSON(raw,st){
    const groups=new Map();
    const reps=new Map();

    for(const f of raw?.features||[]){
      const name=f?.properties?.gnis_name||f?.properties?.GNIS_NAME||'';
      if(!name)continue;
      const lineParts=linesFromGeometry(f.geometry).filter(a=>Array.isArray(a)&&a.length>1);
      if(!lineParts.length)continue;

      const blue=stableBlueForSegment(name,f,st);
      const key=name+'|'+(blue?'1':'0');
      let g=groups.get(key);
      if(!g){
        g={type:'Feature',properties:{gnis_name:name,rf_state:st,rf_blue:blue?1:0},
           geometry:{type:'MultiLineString',coordinates:[]}};
        groups.set(key,g);
      }
      g.geometry.coordinates.push(...lineParts);

      const c=rfNhdCenter(f.geometry);
      if(c){
        const km=Number(f?.properties?.lengthkm)||0;
        const old=reps.get(name);
        if(!old||km>old.km)reps.set(name,{c,km});
      }
    }

    return{
      geo:{type:'FeatureCollection',features:[...groups.values()]},
      reps
    };
  }

  rfFetchMajorState=async function(st){
    if(stableCache.has(st))return stableCache.get(st);
    if(stableLoading.has(st))return stableLoading.get(st);

    const p=(async()=>{
      const names=rfMajorNames(st);
      if(!names.length)return{geo:{type:'FeatureCollection',features:[]},reps:new Map()};
      const bb=RF_STATE_BOUNDS[st];
      const where=`ftype=460 AND gnis_name IN (${names.map(rfSqlQuote).join(',')})`;
      const geom=[bb[0][1],bb[0][0],bb[1][1],bb[1][0]].join(',');
      // Major rivers are an exploration overlay, not survey-grade geometry.
      // Strong simplification is visually invisible at state scale and drastically
      // reduces coordinate count/memory on phones.
      const offset=lowMemory?'0.00085':'0.00045';
      const cap=lowMemory?1400:1900;
      const u=`${RF_NHD_FLOW}/query?where=${encodeURIComponent(where)}&geometry=${encodeURIComponent(geom)}&geometryType=esriGeometryEnvelope&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=gnis_name,reachcode,lengthkm&returnGeometry=true&outSR=4326&geometryPrecision=4&maxAllowableOffset=${offset}&resultRecordCount=${cap}&f=geojson`;

      try{
        const r=await fetch(u,{cache:'force-cache'});
        const j=await r.json();
        if(!r.ok||j.error)throw Error(j.error?.message||`Major rivers ${r.status}`);
        const compact=compactMajorGeoJSON(j,st);
        stableCache.set(st,compact);
        return compact;
      }catch(e){
        console.warn('RiverFlow stable major network',st,e);
        const empty={geo:{type:'FeatureCollection',features:[]},reps:new Map()};
        stableCache.set(st,empty);
        return empty;
      }finally{
        stableLoading.delete(st);
      }
    })();

    stableLoading.set(st,p);
    return p;
  };

  function bucket(z){
    if(z<=5.75)return 0;
    if(z<=7.25)return 1;
    if(z<=8.75)return 2;
    return 3;
  }

  function clearStableMajor(){
    RF_MAJOR_LAYER?.clearLayers();
    RF_MAJOR_OUTLINE_LAYER?.clearLayers();
    RF_MAJOR_STAR_LAYER?.clearLayers();
    labelLayer?.clearLayers();
    drawKey='';
  }

  function featureMeta(f,st){
    const name=f?.properties?.gnis_name||'';
    const blue=!!(+f?.properties?.rf_blue);
    const c=rfNhdCenter(f.geometry);
    const water=c?rfRiverCatalogMatch(name,c.lat,c.lng,st):null;
    return{name,blue,c,water,saved:rfSavedWater(water)};
  }

  function addOneLabel(name,c,blue,z){
    if(!labelLayer||!c||z<5.8||z>9.6)return;
    // Keep far zoom uncluttered: label only the strongest first names per state
    // at whole-region scale; more labels appear as the user zooms in.
    const cls='rfMajorStaticLabel'+(blue?' gold':'');
    L.marker([c.lat,c.lng],{
      interactive:false,keyboard:false,
      icon:L.divIcon({className:'',html:`<div class="${cls}">${blue?'◆ ':''}${E(name)}</div>`,iconSize:null,iconAnchor:[0,0]})
    }).addTo(labelLayer);
  }

  rfRenderMajorRivers=async function(){
    if(!M||!RF_MAJOR_LAYER)return;
    const z=M.getZoom();
    if(!rfFilterOn('rivers')){
      if(drawKey)clearStableMajor();
      return;
    }

    const states=rfMajorVisibleStates();
    const key=states.join(',')+'|'+bucket(z);
    if(key===drawKey)return;

    const token=++renderToken;
    const parts=await Promise.all(states.map(async st=>({st,data:await rfFetchMajorState(st)})));
    if(token!==renderToken||!M)return;

    RF_MAJOR_LAYER.clearLayers();
    RF_MAJOR_OUTLINE_LAYER?.clearLayers(); // deliberately kept empty: prevents 2x geometry
    RF_MAJOR_STAR_LAYER?.clearLayers();

    if(!labelLayer)labelLayer=L.layerGroup().addTo(M);
    else labelLayer.clearLayers();

    for(const {st,data} of parts){
      const metaCache=new WeakMap();
      const meta=f=>{
        let m=metaCache.get(f);
        if(!m){m=featureMeta(f,st);metaCache.set(f,m)}
        return m;
      };

      L.geoJSON(data.geo,{
        renderer:RF_MAJOR_RENDERER||RF_MAP_RENDERER||undefined,
        pane:'rfMajorLines',
        style:f=>{
          const m=meta(f);
          const selected=!!(MAP_SELECTED&&m.water&&MAP_SELECTED.id===m.water.id);
          return{
            color:selected?RF_RIVER_SELECTED_COLOR:(m.blue?RF_RIVER_BLUE_COLOR:RF_RIVER_NORMAL_COLOR),
            weight:selected?rfMajorWidth(z,m.blue)+1.4:rfMajorWidth(z,m.blue),
            opacity:.97,
            interactive:true,
            lineCap:'round',
            lineJoin:'round'
          };
        },
        onEachFeature:(f,l)=>{
          const m=meta(f);
          if(!m.name)return;
          // Canvas tolerance provides a much larger invisible tap target than the visible line.
          l.on('click',e=>rfOpenRiverLine(f,e.latlng));
        }
      }).addTo(RF_MAJOR_LAYER);

      // One label and one saved star per river, rather than one per NHD segment.
      let labelCount=0;
      const farLimit=z<6.3?6:99;
      for(const [name,o] of data.reps){
        const w=rfRiverCatalogMatch(name,o.c.lat,o.c.lng,st);
        const isBlue=!!rfBlueReachNear(name,o.c,st);
        if(labelCount<farLimit){addOneLabel(name,o.c,isBlue,z);labelCount++}
        if(!rfSavedWater(w))continue;
        const icon=L.divIcon({className:'',html:'<div class="rfSavedRiverStar">★</div>',iconSize:[24,24],iconAnchor:[12,12]});
        L.marker([o.c.lat,o.c.lng],{icon,pane:'markerPane',keyboard:false})
          .addTo(RF_MAJOR_STAR_LAYER)
          .bindTooltip(`Saved · ${E(name)}`,{direction:'top'})
          .on('click',()=>{
            MAP_SELECTED={...w,lat:o.c.lat,lng:o.c.lng,_riverLineTap:true};
            RF_SHEET_TAB='overview';RF_SHEET_PEEK=false;
            renderSelectionHost();renderAccessLayer();
          });
      }
    }
    drawKey=key;
  };

  rfMajorSchedule=function(){
    clearTimeout(rfMajorSchedule.t);
    rfMajorSchedule.t=setTimeout(rfRenderMajorRivers,220);
  };

  // Detailed tributaries still start at close zoom, but the compact major-river
  // corridor now remains underneath them for seamless color and geometry continuity.
  const denseNhdBase=RF_NHD_LOAD_MAJOR_BASE;
  rfLoadNhdViewport=async function(){
    if(!M||!RF_NHD_LAYER)return;
    if(M.getZoom()<10.6){
      if(RF_NHD_LAYER.getLayers?.().length)RF_NHD_LAYER.clearLayers();
      return;
    }
    return denseNhdBase();
  };

  // Selection changes only need a style refresh if a different river becomes active.
  const sheetBase=renderSelectionHost;
  renderSelectionHost=function(){
    sheetBase();

<script id="rf-identity-bug-audit-script">
/* RiverFlow v2.5 — hydrographic identity audit + river-specific Bug Advice.
   Rule: hydrography name first; fishing intelligence second. */

let RF_COND_TAB='water';

/* ---------- STRICT HYDROGRAPHIC IDENTITY ---------- */

/* Keep fork/directional identity. Only remove reach qualifiers such as "Lower Provo"
   when they are not part of a fork name. */
function rfHydroKey(input){
  let s=String(input||'').toLowerCase()
    .replace(/[’']/g,"'")
    .replace(/[·|/]/g,' ')
    .replace(/\bsaint\b/g,'st')
    .replace(/\briv\b/g,'river')
    .replace(/\brvr\b/g,'river')
    .replace(/\br\b/g,'river')
    .replace(/\bcr\b/g,'creek')
    .replace(/\bck\b/g,'creek')
    .replace(/\bfk\b/g,'fork')
    .replace(/\bnr\b/g,'near')
    .replace(/[^a-z0-9\s-]+/g,' ')
    .replace(/\s+/g,' ')
    .trim();

  /* Gauge/location descriptors are not part of the waterbody name. */
  s=s.split(/\b(?:at|near|below|above|downstream|upstream|blw|abv)\b/)[0].trim();

  /* "Lower Provo" is a reach of Provo River. "Middle Fork Salmon" is a distinct river. */
  s=s.replace(/^(?:the\s+)?(upper|middle|lower)\s+(?!fork\b)/,'');
  s=s.replace(/^the\s+/,'');

  /* Waterbody type is not identity, but "fork" absolutely is. */
  s=s.replace(/\b(?:river|creek|stream)\b$/,'').trim();
  return s.replace(/\s+/g,' ').trim();
}

function rfWaterHydroKeys(w){
  if(!w)return[];
  let vals=[];
  if(w.hydroName)vals.push(w.hydroName);
  if(w.hydroOfficialName)vals.push(w.hydroOfficialName);
  if(w.rawName)vals.push(String(w.rawName).split(/[·|/]/)[0]);
  if(w.name)vals.push(w.name);
  if(Array.isArray(w.aliases))vals.push(...w.aliases);
  return [...new Set(vals.map(rfHydroKey).filter(Boolean))];
}

function rfHydroDistanceLimit(w){
  if(Number.isFinite(+w?.matchRadiusMi))return +w.matchRadiusMi;
  if(String(w?.id||'').startsWith('reach-'))return 13;
  if(w?.canonical)return 15;
  return 22;
}

/* Explicitly identify canonical mainstem records that previously used marketing/reach names. */
try{
  for(const w of RF_NAMED_RIVER_REACHES||[]){
    if(w.id==='reach-lower-provo'){
      w.hydroName='Provo River';
      w.matchRadiusMi=13;
      w.blue=false; /* lower canyon is not allowed to inherit Middle-Provo gold */
    }
    if(/green river/i.test(w.name||''))w.hydroName='Green River';
  }
}catch{}

/* Exact identity only. No includes(), no stripping North/South/Fork. */
rfRiverCatalogMatch=function(name,lat,lng,stateHint=''){
  const key=rfHydroKey(name);
  if(!key)return null;
  let candidates=allLoadedRivers().filter(w=>{
    if(w.type!=='river')return false;
    if(stateHint&&w.state&&w.state!==stateHint)return false;
    return rfWaterHydroKeys(w).includes(key);
  });
  if(!candidates.length)return null;

  if(Number.isFinite(lat)&&Number.isFinite(lng)){
    candidates=candidates.map(w=>({...w,_rfMatchMi:hav(lat,lng,+w.lat,+w.lng)}))
      .filter(w=>Number.isFinite(w._rfMatchMi)&&w._rfMatchMi<=rfHydroDistanceLimit(w))
      .sort((a,b)=>a._rfMatchMi-b._rfMatchMi);
  }else{
    candidates.sort((a,b)=>bScore(b)-bScore(a));
  }
  return candidates[0]||null;
};

/* Provo Blue Ribbon is kept reach-specific. The app must never make South/North Fork
   Provo gold merely because they are nearby. For other waters, exact hydro identity plus
   a conservative proximity to a verified Blue Ribbon profile is required. */
rfBlueReachNear=function(name,c,st){
  if(!c)return null;
  const key=rfHydroKey(name);
  if(!key)return null;

  if(st==='UT'&&key==='provo'){
    /* Conservative mainstem Middle-Provo corridor: Jordanelle -> Deer Creek.
       This deliberately stops before the Lower Provo canyon. */
    const inMiddle =
      c.lat>=40.425 && c.lat<=40.655 &&
      c.lng>=-111.605 && c.lng<=-111.330;
    if(!inMiddle)return null;
  }

  let a=allLoadedRivers().filter(w=>{
    if(!w.blue||w.state!==st)return false;
    return rfWaterHydroKeys(w).includes(key);
  });
  if(!a.length)return null;
  a=a.map(w=>({...w,_rfBlueMi:hav(c.lat,c.lng,+w.lat,+w.lng)}))
     .filter(w=>Number.isFinite(w._rfBlueMi)&&w._rfBlueMi<=14)
     .sort((x,y)=>x._rfBlueMi-y._rfBlueMi);
  return a[0]||null;
};

/* Access spots also use strict river identity so a South Fork can never inherit
   mainstem Provo parking/wading spots. */
function rfReachKey(input){
  let s=String(input||'').toLowerCase()
    .replace(/[’']/g,"'")
    .replace(/[·|/]/g,' ')
    .replace(/\briv\b/g,'river').replace(/\brvr\b/g,'river').replace(/\br\b/g,'river')
    .replace(/\bcr\b/g,'creek').replace(/\bck\b/g,'creek').replace(/\bfk\b/g,'fork')
    .replace(/[^a-z0-9\s-]+/g,' ').replace(/\s+/g,' ').trim();
  s=s.split(/\b(?:at|near|below|above|downstream|upstream|blw|abv)\b/)[0].trim();
  return s.replace(/^the\s+/,'').replace(/\b(?:river|creek|stream)\b$/,'').replace(/\s+/g,' ').trim();
}
function rfSelectedReachKey(w){
  if(!w)return'';
  if(w.id==='reach-lower-provo')return'lower provo';
  let gid=String(w.gaugeId||w.id||'');
  let pt='';
  try{pt=P?.[gid]?.title||''}catch{}
  if(/^(upper|middle|lower)\s+/i.test(pt))return rfReachKey(pt);
  if(/^(upper|middle|lower)\s+/i.test(w.name||''))return rfReachKey(w.name);
  return rfReachKey(w.hydroOfficialName||w.hydroName||w.name||w.rawName);
}
rfAccessSpots=function(w){
  if(!w||!Array.isArray(WADE_ACCESS))return[];
  const hydro=rfHydroKey(w.hydroOfficialName||w.hydroName||w.name||w.rawName);
  const selectedReach=rfSelectedReachKey(w);
  if(!hydro)return[];
  return WADE_ACCESS
    .filter(a=>{
      if(rfHydroKey(a.river)!==hydro)return false;
      const ar=rfReachKey(a.river);
      /* If an access dataset explicitly says Upper/Middle/Lower, honor that reach. */
      if(/^(upper|middle|lower)\s+/.test(ar)){
        return ar===selectedReach;
      }
      return true;
    })
    .map(a=>({...a,_mi:Number.isFinite(+w.lat)&&Number.isFinite(+w.lng)
      ?Math.round(hav(+w.lat,+w.lng,+a.lat,+a.lng)*10)/10:null}))
    .filter(a=>a._mi==null||a._mi<=18)
    .sort((a,b)=>(a._mi??999)-(b._mi??999));
};

/* All labels come from the official NHD/GNIS feature name. Curated information may enrich
   the sheet only after exact identity + distance checks succeed. */
rfNhdMeta=function(f){
  let n=f?.properties?.gnis_name||f?.properties?.GNIS_NAME||'';
  let c=rfNhdCenter(f?.geometry),st=c?rfStateAtPoint(c.lat,c.lng):(MAP_STATE==='ALL'?'':MAP_STATE);
  let w=n&&c?rfRiverCatalogMatch(n,c.lat,c.lng,st):null;
  return {name:n,center:c,state:st,water:w,blue:!!(n&&c&&rfBlueReachNear(n,c,st))};
};

rfOpenRiverLine=function(f,latlng){
  const n=f?.properties?.gnis_name||f?.properties?.GNIS_NAME||'';
  if(!n)return;
  const lat=+latlng?.lat,lng=+latlng?.lng,st=rfStateAtPoint(lat,lng);
  const w=rfRiverCatalogMatch(n,lat,lng,st);
  const blue=!!rfBlueReachNear(n,{lat,lng},st);

  if(w){
    MAP_SELECTED={
      ...w,
      name:String(w.id||'').startsWith('reach-')?(w.name||n):n,
      lat,lng,
      blue,
      hydroOfficialName:n,
      hydroName:n,
      _catalogLat:w.lat,_catalogLng:w.lng,
      _riverLineTap:true
    };
  }else{
    MAP_SELECTED={
      id:'nhd-'+(f.properties?.reachcode||rfHydroKey(n))+'-'+lat.toFixed(4)+'-'+lng.toFixed(4),
      kind:'nhd',type:'river',state:st,
      name:n,rawName:n,hydroOfficialName:n,hydroName:n,
      lat,lng,blue,
      trophy:false,current20:false,verifiedInches:null,highElevation:false,gem:false,score:0,
      species:'Named stream / river',
      note:'Official named hydrography. RiverFlow has not attached reach-specific fishing intelligence here yet.',
      source:'USGS National Hydrography Dataset'
    };
  }
  RF_SHEET_TAB='overview';
  RF_COND_TAB='water';
  RF_SHEET_PEEK=false;
  renderSelectionHost();
  renderAccessLayer();
  scheduleOwnership();
};

/* Avoid a state-wide ambiguous "Rock Creek" query until individual Montana Rock Creeks
   are spatially constrained. Official detailed hydrography still shows them at close zoom. */
const RF_MAJOR_NAMES_STRICT_BASE=rfMajorNames;
rfMajorNames=function(st){
  return RF_MAJOR_NAMES_STRICT_BASE(st).filter(n=>!(st==='MT'&&rfHydroKey(n)==='rock'));
};

      ['Golden stones / stoneflies','#6–12','nymph → adult','Pat’s Rubber Legs / Chubby'],
      ['PMD','#14–18','nymph → emerger → dun','PMD emerger / Sparkle Dun'],
      ['Yellow Sallies','#14–18','nymph → adult','Small stonefly / Stimulator'],
      ['Caddis','#14–18','pupa → adult','X-Caddis']
    ];
    return {specific:true,label:'South Fork Snake profile',sourceLabel:'RiverFlow river profile',...base};
  }
  if(key==='snake'&&w?.state==='WY'){
    let base=rfGenericSeasonalBugs(m);
    if(m>=7&&m<=9)base.bugs=[
      ['PMD / small mayflies','#16–20','emerger → dun','Sparkle Dun'],
      ['Caddis','#14–18','pupa → adult','X-Caddis'],
      ['Terrestrials','#8–16','adult','Hopper / ant / beetle']
    ];
    return {specific:true,label:'Wyoming Snake River profile',sourceLabel:'RiverFlow river profile',...base};
  }
  if(key==='new fork'){
    let base=rfGenericSeasonalBugs(m);
    if(m>=6&&m<=8)base.bugs=[
      ['PMD / mayflies','#16–20','nymph → emerger → dun','PMD emerger'],
      ['Caddis','#14–18','pupa → adult','X-Caddis'],
      ['Green Drake / drakes','#10–14','nymph → dun','Drake nymph / dry'],
      ['Terrestrials','#10–16','adult','Hopper / ant']
    ];
    return {specific:true,label:'New Fork profile',sourceLabel:'RiverFlow river profile',...base};
  }
  if(key==='st joe'){
    let base=rfGenericSeasonalBugs(m);
    if(m>=7&&m<=9)base.bugs=[
      ['Caddis','#14–18','pupa → adult','X-Caddis / Elk Hair Caddis'],
      ['Terrestrials','#10–16','adult','Hopper / ant / beetle'],
      ['Small mayflies','#18–22','emerger → dun','Small parachute / emerger']
    ];
    return {specific:true,label:'St. Joe River profile',sourceLabel:'RiverFlow river profile',...base};
  }
  if(key==='weber'){
    let base=rfGenericSeasonalBugs(m);
    return {specific:true,label:'Weber River seasonal profile',sourceLabel:'RiverFlow river profile',...base};
  }
  return null;
}

function rfReportBugBoost(profile,g){
  let r=null;
  try{r=g?report(g):null}catch{}
  if(!r)return {...profile,report:null};
  let rs=null;
  try{rs=reportState(r)}catch{}
  if(!rs||rs.age>30)return {...profile,report:r};

  const t=String(r.summary||'').toLowerCase();
  const scoreBug=x=>{
    const n=String(x[0]).toLowerCase();
    let s=0;
    if(n.includes('pmd')&&t.includes('pmd'))s+=5;
    if(/caddis/.test(n)&&/caddis/.test(t))s+=5;
    if(/midge/.test(n)&&/midge/.test(t))s+=5;
    if(/bwo|baetis/.test(n)&&/bwo|baetis/.test(t))s+=5;
    if(/stone|sally|salmon/.test(n)&&/stone|sally|salmonfly/.test(t))s+=5;
    if(/terrestrial|hopper|ant|beetle/.test(n)&&/terrestrial|hopper|ant|beetle/.test(t))s+=5;
    if(/drake/.test(n)&&/drake/.test(t))s+=5;
    if(/trico/.test(n)&&/trico/.test(t))s+=5;
    return s;
  };
  let bugs=profile.bugs.map((x,i)=>({x,i,s:scoreBug(x)}))
    .sort((a,b)=>b.s-a.s||a.i-b.i).map(o=>o.x);
  return {...profile,bugs,report:r,reportFresh:true};
}

function rfBugAdviceForWater(w,g){
  const m=MONTH();
  const key=rfHydroKey(w?.hydroOfficialName||w?.hydroName||g?.name||w?.name);
  let p=null;

  if(key==='provo'){
    const title=String(w?.name||'')+' '+String(g?prof(g)?.title||'':'');
    const lower=w?.id==='reach-lower-provo' ||
      /lower provo/i.test(title) ||
      (Number.isFinite(+w?.lat)&&+w.lat<40.425);
    const middle=/middle provo/i.test(title) ||
      (!lower && Number.isFinite(+w?.lat)&&+w.lat>=40.425&&+w.lat<=40.655&&+w.lng>=-111.605&&+w.lng<=-111.330);

    if(lower){
      p={
        specific:true,label:'Lower Provo River profile',
        sourceLabel:'CUWCD / Provo seasonal + report profile',
        sourceUrl:w?.externalIntelUrl||RF_LOWER_PROVO_FLOW_URL,
        bugs:rfProvoLowerProfile(m).bugs,food:rfProvoLowerProfile(m).food,
        note:'Tailwater food base and seasonal hatch plan. Exact daily emergence still depends on temperature, light and weather.'
      };
    }else if(middle){
      const q=rfProvoMiddleProfile(m);
      p={
        specific:true,label:'Middle Provo River profile',
        sourceLabel:'Utah DWR + current RiverFlow reports',
        sourceUrl:'https://wildlife.utah.gov/?Itemid=477&catid=70&id=595&option=com_content&view=article',
        bugs:q.bugs,food:q.food,
        note:'Middle-Provo-specific seasonal biology. Utah DWR specifically highlights the Green Drake window in June and sometimes July.'
      };
    }
  }

  if(!p)p=rfNamedBugProfile(key,m,w,g);

  if(!p){
    const q=rfGenericSeasonalBugs(m);
    p={
      specific:false,label:'Regional seasonal estimate',
      sourceLabel:'Regional trout-stream baseline',
      bugs:q.bugs,food:q.food,note:
      'RiverFlow has not verified a river-specific hatch profile for this exact named water yet. This is a regional seasonal starting point, not a claim that these insects are hatching now.'
    };
  }

  return rfReportBugBoost(p,g);
}

function rfBugAdviceHtml(w,g){
  const a=rfBugAdviceForWater(w,g);
  let recs=a.bugs.slice(0,4).map((x,i)=>{
    const pattern=String(x[3]||'').split('/')[0].trim();
    return {rank:i+1,pattern,size:x[1],why:`${x[0]} · ${x[2]}`};
  });
  let ranked=[];
  try{ranked=rankBoxFlies(recs,3)}catch{}

  const accuracy=a.specific?'River-specific profile':'Regional estimate';
  const reportText=a.reportFresh&&a.report
    ?`A fresh ${E(a.report.source)} report is re-ordering the seasonal list.`
    :a.note;

  return`
    <div class="rfBugAccuracy ${a.specific?'':'regional'}">
      <i></i><div><b>${E(accuracy)}${a.reportFresh?' + current report':''}</b>${reportText?E(reportText):''}</div>
    </div>
    <div class="rfPanel">
      <span class="k">Bug advice</span>
      <h3>${E(a.label)}</h3>
      <p>This is fishing advice, not a live insect sensor. Verify what you see on the water.</p>
      <div class="rfBugRows">
        ${a.bugs.slice(0,5).map(x=>`
          <div class="rfBugAdviceRow">
            <div><h4>${E(x[0])}</h4><p>${E(x[2])} · Try ${E(x[3])}</p></div>
            <strong>${E(x[1])}</strong>
          </div>`).join('')}
      </div>
      <div class="section" style="margin-top:11px">Food base</div>
      <div class="rfSpeciesGrid">${a.food.map(x=>`<span class="rfSpeciesPill">${E(x)}</span>`).join('')}</div>
      ${ranked.length?`
        <div class="rfBugFlyPick">
          <span>BEST MATCH IN MY BOXES</span>
          <b>${E(ranked[0].pattern)} ${E(ranked[0].size)}</b>
          <small>${E(ranked[0].boxName)} · ${E(ranked[0].color||'saved fly')}</small>
        </div>`:''}
      <div class="rfSourceStack">
        ${a.sourceUrl?`<a target="_blank" href="${E(a.sourceUrl)}"><span>${E(a.sourceLabel)}</span><span>↗</span></a>`:''}
        ${a.reportFresh&&a.report?.url?`<a target="_blank" href="${E(a.report.url)}"><span>${E(a.report.source)} report</span><span>↗</span></a>`:''}
      </div>
    </div>`;
}

const RF_SHEET_OVERVIEW_IDENTITY_BASE=rfSheetOverview;
rfSheetOverview=function(w,g,p){

rfSheetConditions=function(w,g){

      <div class="rfConditionCard"><span>WATER TEMP</span><b>${temp!=null?Math.round(temp)+'°F':'—'}</b><small>${temp==null?'Not reported':temp>=67?'Warm — use caution':'Trout-safe range depends on species/reach'}</small></div>

window.RIVERFLOW_PROTOTYPE_VERSION='v2.5-river-identity-bug-audit';
try{document.title='RiverFlow — River Identity + Bug Advice Audit'}catch{}

setTimeout(()=>{

<script id="rf-beginner-now-v26-script">
let RF_COND_DETAIL='now';
const RF_NOW_CONTEXT=new Map();

function rfNowId(w,g){return String(w?.id||g?.id||`${w?.lat||0},${w?.lng||0}`)}
function rfNowContext(w,g){return RF_NOW_CONTEXT.get(rfNowId(w,g))||{}}
function rfNowHour(){return new Date().getHours()}
function rfDoy(){let d=new Date(),s=new Date(d.getFullYear(),0,0);return Math.floor((d-s)/86400000)}
function rfNowTemp(w,g){let x=w?.tempF??g?.tempF;return Number.isFinite(+x)?+x:null}
function rfNowCfs(w,g){let x=w?.cfs??g?.cfs;return Number.isFinite(+x)?+x:null}
function rfNowReport(g){try{let r=g?report(g):null;if(!r)return null;let s=reportState(r);return {...r,_age:s?.age??999,_fresh:(s?.age??999)<=30}}catch{return null}}

function rfBugFamily(n){
  n=String(n||'').toLowerCase();
  if(/green drake|drake/.test(n))return'drake';
  if(/pmd|pale morning/.test(n))return'pmd';
  if(/bwo|baetis|blue wing/.test(n))return'bwo';
  if(/caddis/.test(n))return'caddis';
  if(/midge/.test(n))return'midge';
  if(/yellow sall/.test(n))return'sally';
  if(/stone|salmonfly/.test(n))return'stone';
  if(/trico/.test(n))return'trico';
  if(/callibaetis/.test(n))return'callibaetis';
  if(/terrestrial|hopper|ant|beetle/.test(n))return'terrestrial';
  if(/sowbug/.test(n))return'sowbug';
  if(/scud/.test(n))return'scud';
  return'other';
}
function rfDateFit(f,d){
  const W={
    midge:[[1,365]],bwo:[[60,130],[245,315]],pmd:[[145,245]],caddis:[[120,285]],
    drake:[[155,205]],sally:[[150,225]],stone:[[125,215]],trico:[[190,265]],
    callibaetis:[[160,265]],terrestrial:[[185,285]],sowbug:[[1,365]],scud:[[1,365]],other:[[1,365]]
  };
  return (W[f]||W.other).some(x=>d>=x[0]&&d<=x[1])?8:-10;
}
function rfTempFit(f,t){
  if(t==null)return 0;
  const R={midge:[36,57],bwo:[40,57],pmd:[50,65],caddis:[48,68],drake:[49,63],sally:[48,64],stone:[44,63],trico:[54,68],callibaetis:[52,68],terrestrial:[52,70],sowbug:[34,68],scud:[34,66],other:[42,66]};
  let [lo,hi]=R[f]||R.other;
  if(t>=lo&&t<=hi)return 10;
  let gap=t<lo?lo-t:t-hi;
  return gap<=4?3:-Math.min(16,Math.round(gap*1.7));
}
function rfTimeFit(f,h){
  const W={midge:[[9,15]],bwo:[[10,16]],pmd:[[10,16]],caddis:[[6,10],[17,21]],drake:[[9,15]],sally:[[8,15]],stone:[[6,11],[17,21]],trico:[[7,11]],callibaetis:[[9,15]],terrestrial:[[11,18]],sowbug:[[0,24]],scud:[[0,24]],other:[[8,18]]};
  return (W[f]||W.other).some(x=>h>=x[0]&&h<x[1])?7:-2;
}
function rfMiddleProvoBoost(w,f,d){
  if(rfHydroKey(w?.hydroOfficialName||w?.hydroName||w?.name)!=='provo')return 0;
  let middle=Number.isFinite(+w?.lat)&&+w.lat>=40.425&&+w.lat<=40.655&&+w.lng>=-111.605&&+w.lng<=-111.330;
  if(!middle||f!=='drake')return 0;
  if(d>=158&&d<=188)return 12;
  if(d>188&&d<=205)return 4;
  return -12;
}
function rfWeatherFit(f,ctx){
  let t=String(ctx?.weatherText||'').toLowerCase();
  if(!t)return 0;
  if(f==='bwo'&&/cloud|overcast|shower|rain/.test(t))return 9;
  if(f==='terrestrial'&&/rain|shower|storm/.test(t))return -8;
  return 0;
}

  let r=rfNowReport(g);if(!r?._fresh)return false;
  let t=String(r.summary||'').toLowerCase(),f=rfBugFamily(name);
  const P={pmd:/pmd|pale morning/,bwo:/bwo|baetis|blue.?wing/,caddis:/caddis/,midge:/midge/,drake:/drake/,sally:/sally|yellow stone/,stone:/stone|salmonfly/,trico:/trico/,terrestrial:/terrestrial|hopper|ant|beetle/,callibaetis:/callibaetis/,sowbug:/sowbug/,scud:/scud/};

  score+=rfWeatherFit(f,ctx);
  if(ctx?.flowTrend?.kind==='stable'){score+=4;why.push('flow is stable')}
  if(ctx?.flowTrend?.kind==='rising')score-=7;
  if(rfReportMentions(g,row[0])){score+=14;why.unshift('fresh report mentions it')}

function rfRankNow(w,g,ctx){
  let a=rfBugAdviceForWater(w,g),ranked=(a.bugs||[]).map((r,i)=>rfScoreBug(w,g,r,i,ctx)).sort((x,y)=>y.score-x.score);

}
function rfNowPattern(row){return String(row?.[3]||'Pheasant Tail').split('/')[0].trim()}
function rfNowRig(w,g,p){
  let stage=String(p?.row?.[2]||'nymph').toLowerCase(),cfs=rfNowCfs(w,g);
  if(/adult|dry|dun|spinner/.test(stage)&&!/nymph|larva|pupa/.test(stage))return{rig:'Single dry · 9–12 ft leader',depth:'Surface / film',cast:'Riffle edges, soft seams and feeding lanes.'};
  if(/emerger/.test(stage))return{rig:'Dry-dropper or light 2-fly nymph rig',depth:'Start 1–3 ft deep',cast:'Riffle-to-run transitions; lift or swing at the end.'};
  let depth=cfs!=null&&cfs>800?'5–7 ft':cfs!=null&&cfs<250?'3–4.5 ft':'4–6 ft';
  return{rig:'2-fly nymph rig · light indicator',depth:`${depth}; adjust until you occasionally touch bottom`,cast:'Walking-speed seams, riffle transitions and soft edges.'}
}
function rfWhereNow(w,g,ctx){
  let c=rfNowCfs(w,g);
  if(c!=null&&c>1000)return'High water: inside seams, banks, soft edges and slower side water.';
  if(c!=null&&c<180)return'Low water: deeper slots, shaded banks and riffle heads; approach carefully.';
  if(ctx?.flowTrend?.kind==='rising')return'Rising water: fish the soft edge before the fastest center current.';
  return'Riffle-to-run transitions, walking-speed seams and the soft edge beside faster water.';
}
function rfNowDifficulty(w,p){
  let key=rfHydroKey(w?.hydroOfficialName||w?.hydroName||w?.name),score=2,size=bugSizeNumber(p?.row?.[1]||'#18');
  if(['silver','henrys fork'].includes(key))score+=2;
  if(key==='green'||key==='south fork snake')score+=1;
  if(size>=20)score+=1;
  let spots=0;try{spots=rfAccessSpots(w).length}catch{};if(spots>=2)score-=1;
  if(score<=1)return{label:'Beginner Friendly',cls:'easy',why:'A clear starting plan and mapped access make this easier to approach.'};
  if(score>=4)return{label:'Technical',cls:'tech',why:'Smaller flies, selective fish or demanding presentation can punish mistakes.'};

function rfNowConfidence(w,g,ctx,a){

  if(rfNowReport(g)?._fresh){p+=2;r.push('fresh report')}

function rfNowBox(ranked){
  let recs=ranked.slice(0,4).map((x,i)=>({rank:i+1,pattern:rfNowPattern(x.row),size:x.row[1],why:`${x.row[0]} · ${x.label}`}));

}
function rfNowPlan(w,g,ctx){

function rfFlowTrend(points){
  let a=(points||[]).filter(x=>Number.isFinite(+x.value));if(a.length<4)return null;
  let s=a.slice(-Math.min(12,a.length)),first=+s[0].value,last=+s[s.length-1].value;if(!first)return null;
  let pct=(last-first)/first*100,kind=pct>12?'rising':pct<-12?'falling':'stable';
  return{pct,kind,text:kind==='stable'?'stable':`${kind} ${Math.round(Math.abs(pct))}%`}
}
async function rfLoadNowContext(w,g){
  let id=rfNowId(w,g),old=RF_NOW_CONTEXT.get(id);

    (async()=>{try{let r=await fetch(`https://riverflow-v2-weather.vercel.app/api/weather?lat=${+w.lat}&lng=${+w.lng}`),j=await r.json();ctx.weatherDays=(j.days||[]).slice(0,3);ctx.weatherText=ctx.weatherDays.map(x=>x.forecast||'').join(' ')}catch{}})()
  ]);

<script id="rf-v27-clean-map-script">
/* RiverFlow v2.7
   Default map = rivers.
   Visible discovery filters = Blue Ribbon + Big Fish Rivers only.

   RiverFlow/NHD vector layers remain the interactive intelligence layer at closer zoom. */

function rfExploreOpacity(){

  let op=z<=7.5?.94:z<=9?.88:z<=10.5?.76:.56;

function rfInstallExploreHydro(){

    RF_EXPLORE_HYDRO=L.tileLayer(RF_USGS_HYDRO_CACHE,{
      pane:'rfExploreHydro',

      updateInterval:180,

    M.on('zoomend',rfExploreOpacity);

}
