<script id="rf-v29-premium-river-tap-script">
/* RiverFlow v2.9
   Premium interaction:
   - Cached hydrography stays cheap and visible at regional scale.
   - A map tap performs a tiny point-radius hydrography query only where the user touched.
   - The nearest visible flowline becomes the selected river.
   - Exact reach intelligence is attached only inside its verified radius.
   - Farther points on the same named river get a safe river-system profile.
   - Nearby verified access spots auto-highlight. */

let RF_HYDRO_TAP_REQ=0;
let RF_LAST_DIRECT_RIVER_TAP=0;
let RF_HYDRO_SELECT_LAYER=null;
let RF_ACCESS_FOCUS_LAYER=null;
let RF_TAP_TOAST_TIMER=null;

function rfTapToast(msg,ms=1100){
  let host=document.querySelector('.mapHome');if(!host)return;
  document.querySelector('.rfTapRiverToast')?.remove();
  let d=document.createElement('div');d.className='rfTapRiverToast';d.textContent=msg;host.appendChild(d);
  clearTimeout(RF_TAP_TOAST_TIMER);RF_TAP_TOAST_TIMER=setTimeout(()=>d.remove(),ms);
}

function rfHydroPointDistancePx(feature,latlng){
  if(!M||!feature?.geometry)return Infinity;
  let q=M.latLngToContainerPoint(latlng),best=Infinity;
  const walkLine=line=>{
    if(!Array.isArray(line)||line.length<2)return;
    let prev=null;
    for(const c of line){
      if(!Array.isArray(c)||c.length<2)continue;
      let cur=M.latLngToContainerPoint([+c[1],+c[0]]);
      if(prev){
        let vx=cur.x-prev.x,vy=cur.y-prev.y,wx=q.x-prev.x,wy=q.y-prev.y;
        let den=vx*vx+vy*vy,t=den?Math.max(0,Math.min(1,(wx*vx+wy*vy)/den)):0;
        let px=prev.x+t*vx,py=prev.y+t*vy,dx=q.x-px,dy=q.y-py;
        best=Math.min(best,Math.sqrt(dx*dx+dy*dy));
      }
      prev=cur;
    }
  };
  let g=feature.geometry;
  if(g.type==='LineString')walkLine(g.coordinates);
  else if(g.type==='MultiLineString')(g.coordinates||[]).forEach(walkLine);
  else if(g.type==='GeometryCollection')(g.geometries||[]).forEach(x=>{
    if(x.type==='LineString')walkLine(x.coordinates);
    if(x.type==='MultiLineString')(x.coordinates||[]).forEach(walkLine);
  });
  return best;
}

function rfHydroTapRadiusMeters(latlng,pixels){
  if(!M)return 3000;
  let p=M.latLngToContainerPoint(latlng),other=M.containerPointToLatLng([p.x+pixels,p.y]);
  return Math.max(120,Math.min(35000,M.distance(latlng,other)));
}

async function rfQueryHydroAtTap(latlng){
  if(!M)return null;
  const req=++RF_HYDRO_TAP_REQ;
  const mobile=matchMedia?.('(max-width:700px)')?.matches!==false;
  const px=mobile?25:18;
  const meters=rfHydroTapRadiusMeters(latlng,px);
  const z=M.getZoom();
  const off=z>=13?'0.00003':z>=10?'0.00012':z>=8?'0.00045':'0.0012';
  let point=`${(+latlng.lng).toFixed(7)},${(+latlng.lat).toFixed(7)}`;
  let url=`${RF_NHD_FLOW}/query?where=${encodeURIComponent("ftype=460")}`+
    `&geometry=${encodeURIComponent(point)}&geometryType=esriGeometryPoint&inSR=4326`+
    `&spatialRel=esriSpatialRelIntersects&distance=${Math.round(meters)}&units=esriSRUnit_Meter`+
    `&outFields=gnis_name,reachcode,fcode,ftype,lengthkm&returnGeometry=true&outSR=4326`+
    `&geometryPrecision=5&maxAllowableOffset=${off}&resultRecordCount=35&f=geojson`;

  try{
    let r=await fetch(url,{cache:'force-cache'}),j=await r.json();
    if(req!==RF_HYDRO_TAP_REQ)return null;
    if(!r.ok||j.error)throw Error(j.error?.message||`Hydrography ${r.status}`);
    let feats=(j.features||[]).map(f=>({f,d:rfHydroPointDistancePx(f,latlng)}))
      .filter(x=>Number.isFinite(x.d))
      .sort((a,b)=>a.d-b.d);
    let best=feats[0];
    if(!best||best.d>px+8)return null;
    return best.f;
  }catch(e){
    console.warn('RiverFlow tap hydrography query',e);
    return null;
  }
}

function rfSystemCandidates(name,st){
  const key=rfHydroKey(name);
  if(!key)return[];
  return allLoadedRivers().filter(w=>{
    if(w.type!=='river')return false;
    if(st&&w.state&&w.state!==st)return false;
    return rfWaterHydroKeys(w).includes(key);
  });
}

function rfSafeRiverSystemWater(name,lat,lng,st){
  let a=rfSystemCandidates(name,st)
    .map(w=>({w,d:hav(lat,lng,+w.lat,+w.lng)}))
    .filter(x=>Number.isFinite(x.d))
    .sort((x,y)=>x.d-y.d);
  if(!a.length)return null;
  let src=a[0].w;
  return{
    id:`system-${st||'XX'}-${rfHydroKey(name).replace(/\s+/g,'-')}-${lat.toFixed(3)}-${lng.toFixed(3)}`,
    kind:'river-system',
    type:'river',
    state:st||src.state||'',
    name:name,
    rawName:name,
    hydroOfficialName:name,
    hydroName:name,
    lat,lng,
    blue:false,
    trophy:false,
    trophyVerified:false,
    current20:false,
    verifiedInches:null,
    gem:false,
    highElevation:false,
    score:src.score||0,
    species:src.species||'Species vary by reach',
    note:`RiverFlow recognizes the ${name} system. Reach-specific flow, trophy, Blue Ribbon and access claims are attached only when verified near the stretch you tapped.`,
    source:src.source||'USGS hydrography',
    _systemMatch:true,
    _systemNearestProfileId:src.id,
    _systemNearestProfileMi:Math.round(a[0].d)
  };
}

function rfFeatureName(f){
  return String(f?.properties?.gnis_name||f?.properties?.GNIS_NAME||'').trim();
}

function rfOpenTappedHydroFeature(f,latlng){
  let name=rfFeatureName(f);
  let lat=+latlng.lat,lng=+latlng.lng,st=rfStateAtPoint(lat,lng);

  if(name){
    let exact=rfRiverCatalogMatch(name,lat,lng,st);
    let blue=!!rfBlueReachNear(name,{lat,lng},st);
    if(exact){
      MAP_SELECTED={
        ...exact,
        name:String(exact.id||'').startsWith('reach-')?(exact.name||name):name,
        lat,lng,blue,
        hydroOfficialName:name,hydroName:name,
        _catalogLat:exact.lat,_catalogLng:exact.lng,
        _riverLineTap:true,_tapScope:'reach'
      };
    }else{
      let system=rfSafeRiverSystemWater(name,lat,lng,st);
      MAP_SELECTED=system||{
        id:`nhd-${f.properties?.reachcode||rfHydroKey(name)}-${lat.toFixed(4)}-${lng.toFixed(4)}`,
        kind:'nhd',type:'river',state:st,name,rawName:name,hydroOfficialName:name,hydroName:name,
        lat,lng,blue:false,trophy:false,current20:false,verifiedInches:null,highElevation:false,gem:false,score:0,
        species:'Named stream / river',
        note:'Official mapped hydrography. RiverFlow has not attached a verified fishery profile to this stream yet.',
        source:'USGS National Hydrography Dataset',
        _tapScope:'explore'
      };
      if(MAP_SELECTED&&MAP_SELECTED._systemMatch)MAP_SELECTED._tapScope='system';
    }
  }else{
    MAP_SELECTED={
      id:`nhd-unnamed-${f.properties?.reachcode||Date.now()}`,
      kind:'nhd',type:'river',state:st,
      name:'Unnamed stream',rawName:'Unnamed stream',
      hydroOfficialName:'Unnamed stream',hydroName:'Unnamed stream',
      lat,lng,blue:false,trophy:false,current20:false,verifiedInches:null,score:0,
      species:'Unverified',
      note:'This mapped stream does not have an official GNIS name in the hydrography result. RiverFlow makes no fishery claim for it.',
      source:'USGS National Hydrography Dataset',
      _tapScope:'explore'
    };
  }

  RF_SHEET_TAB='overview';
  RF_COND_DETAIL='now';
  RF_SHEET_PEEK=false;
  rfHighlightTappedFeature(f);
  renderSelectionHost();
  renderAccessLayer();
  rfRenderFocusedAccess();
  scheduleOwnership();
}

function rfHighlightTappedFeature(f){
  if(!M||!window.L)return;
  if(!RF_HYDRO_SELECT_LAYER)RF_HYDRO_SELECT_LAYER=L.layerGroup().addTo(M);
  RF_HYDRO_SELECT_LAYER.clearLayers();

  let blue=!!(MAP_SELECTED?.blue);
  let outer=blue?'#6f5510':'#064f5c';
  let inner=blue?RF_RIVER_BLUE_COLOR:'#17a9bf';

  L.geoJSON(f,{
    pane:'rfMajorLines',
    renderer:RF_MAJOR_RENDERER||RF_MAP_RENDERER||undefined,

<script id="rf-v210-mainstem-snap-script">
/* RiverFlow v2.10 — smart named-mainstem snap
   Problem solved: NHD can contain unnamed flowline pieces along a visually named river.
   We now prefer the named continuation when it is close and geometrically aligned. */

function rfHydroPointMetrics(feature,latlng){
  if(!M||!feature?.geometry)return{d:Infinity,angle:null};
  let q=M.latLngToContainerPoint(latlng),best={d:Infinity,angle:null};
  const walk=line=>{
    if(!Array.isArray(line)||line.length<2)return;
    let prev=null;
    for(const c of line){
      if(!Array.isArray(c)||c.length<2)continue;
      let cur=M.latLngToContainerPoint([+c[1],+c[0]]);
      if(prev){
        let vx=cur.x-prev.x,vy=cur.y-prev.y,wx=q.x-prev.x,wy=q.y-prev.y;
        let den=vx*vx+vy*vy,t=den?Math.max(0,Math.min(1,(wx*vx+wy*vy)/den)):0;
        let px=prev.x+t*vx,py=prev.y+t*vy,dx=q.x-px,dy=q.y-py,d=Math.sqrt(dx*dx+dy*dy);
        if(d<best.d){
          let a=Math.atan2(vy,vx)*180/Math.PI;
          while(a<0)a+=180;
          while(a>=180)a-=180;
          best={d,angle:a};
        }
      }
      prev=cur;
    }
  };
  let g=feature.geometry;
  if(g.type==='LineString')walk(g.coordinates);
  else if(g.type==='MultiLineString')(g.coordinates||[]).forEach(walk);
  else if(g.type==='GeometryCollection')(g.geometries||[]).forEach(x=>{
    if(x.type==='LineString')walk(x.coordinates);
    if(x.type==='MultiLineString')(x.coordinates||[]).forEach(walk);
  });
  return best;
}
function rfAngleDelta(a,b){
  if(a==null||b==null)return 90;
  let d=Math.abs(a-b)%180;
  return Math.min(d,180-d);
}
function rfMajorNameSet(st){
  try{return new Set((rfMajorNames(st)||[]).map(rfHydroKey))}catch{return new Set()}
}
function rfNamedCandidateScore(x,baseAngle,st){
  let n=rfFeatureName(x.f),k=rfHydroKey(n),major=rfMajorNameSet(st).has(k);
  let ad=rfAngleDelta(baseAngle,x.angle);
  let len=Number(x.f?.properties?.lengthkm)||0;
  return x.d + ad*.55 - (major?14:0) - Math.min(8,len*.15);
}
async function rfNamedRecoveryQuery(latlng,meters,off,req){
  let point=`${(+latlng.lng).toFixed(7)},${(+latlng.lat).toFixed(7)}`;
  let url=`${RF_NHD_FLOW}/query?where=${encodeURIComponent("ftype=460 AND gnis_name IS NOT NULL")}`+
    `&geometry=${encodeURIComponent(point)}&geometryType=esriGeometryPoint&inSR=4326`+
    `&spatialRel=esriSpatialRelIntersects&distance=${Math.round(meters)}&units=esriSRUnit_Meter`+
    `&outFields=gnis_name,reachcode,fcode,ftype,lengthkm&returnGeometry=true&outSR=4326`+
    `&geometryPrecision=5&maxAllowableOffset=${off}&resultRecordCount=60&f=geojson`;
  try{
    let r=await fetch(url,{cache:'force-cache'}),j=await r.json();
    if(req!==RF_HYDRO_TAP_REQ)return[];
    if(!r.ok||j.error)return[];
    return (j.features||[]).map(f=>({f,...rfHydroPointMetrics(f,latlng)})).filter(x=>Number.isFinite(x.d));
  }catch{return[]}
}

/* Replace nearest-segment-only resolver with named-mainstem recovery. */
rfQueryHydroAtTap=async function(latlng){
  if(!M)return null;
  const req=++RF_HYDRO_TAP_REQ;
  const mobile=matchMedia?.('(max-width:700px)')?.matches!==false;
  const px=mobile?26:19;
  const z=M.getZoom();
  const meters=rfHydroTapRadiusMeters(latlng,px);
  const off=z>=13?'0.000025':z>=10?'0.00010':z>=8?'0.00038':'0.0010';
  let point=`${(+latlng.lng).toFixed(7)},${(+latlng.lat).toFixed(7)}`;

  let url=`${RF_NHD_FLOW}/query?where=${encodeURIComponent("ftype=460")}`+
    `&geometry=${encodeURIComponent(point)}&geometryType=esriGeometryPoint&inSR=4326`+
    `&spatialRel=esriSpatialRelIntersects&distance=${Math.round(meters)}&units=esriSRUnit_Meter`+
    `&outFields=gnis_name,reachcode,fcode,ftype,lengthkm&returnGeometry=true&outSR=4326`+
    `&geometryPrecision=5&maxAllowableOffset=${off}&resultRecordCount=45&f=geojson`;

  try{
    let r=await fetch(url,{cache:'force-cache'}),j=await r.json();
    if(req!==RF_HYDRO_TAP_REQ)return null;
    if(!r.ok||j.error)throw Error(j.error?.message||`Hydrography ${r.status}`);

    let all=(j.features||[]).map(f=>({f,...rfHydroPointMetrics(f,latlng)}))
      .filter(x=>Number.isFinite(x.d)).sort((a,b)=>a.d-b.d);
    let nearest=all[0];
    if(!nearest||nearest.d>px+9)return null;

    /* If the actual segment is already named, use it. */
    if(rfFeatureName(nearest.f))return nearest.f;

    const st=rfStateAtPoint(+latlng.lat,+latlng.lng);
    const snapPx=mobile?62:50;
    const maxAngle=38;

    /* First prefer a named, aligned segment already in the normal tap query. */
    let named=all.filter(x=>rfFeatureName(x.f)&&x.d<=snapPx);
    let aligned=named.filter(x=>rfAngleDelta(nearest.angle,x.angle)<=maxAngle);
    let pool=aligned.length?aligned:named.filter(x=>x.d<=px+18);
    if(pool.length){
      pool.sort((a,b)=>rfNamedCandidateScore(a,nearest.angle,st)-rfNamedCandidateScore(b,nearest.angle,st));
      pool[0].f.properties=pool[0].f.properties||{};
      pool[0].f.properties._rfResolvedFromUnnamed=1;
      return pool[0].f;
    }

    /* If the name-bearing segment is a little farther along the same channel,
       perform one larger named-only recovery query. */
    let recoveryMeters=Math.min(10000,Math.max(meters*3.4,900));
    let recovered=await rfNamedRecoveryQuery(latlng,recoveryMeters,off,req);
    if(req!==RF_HYDRO_TAP_REQ)return null;
    let recAligned=recovered.filter(x=>x.d<=snapPx&&rfAngleDelta(nearest.angle,x.angle)<=maxAngle);
    if(recAligned.length){
      recAligned.sort((a,b)=>rfNamedCandidateScore(a,nearest.angle,st)-rfNamedCandidateScore(b,nearest.angle,st));
      recAligned[0].f.properties=recAligned[0].f.properties||{};
      recAligned[0].f.properties._rfResolvedFromUnnamed=1;
      return recAligned[0].f;
    }

    /* Truly unnamed water remains unnamed. */
    return nearest.f;
  }catch(e){
    console.warn('RiverFlow smart hydro tap',e);
    return null;
  }
};

async function rfHighlightNamedRiverInView(name,st,fallbackFeature){
  if(!M||!name)return rfHighlightTappedFeature(fallbackFeature);
  try{
    let b=M.getBounds(),z=M.getZoom();
    let geom=[b.getWest(),b.getSouth(),b.getEast(),b.getNorth()].map(x=>Number(x.toFixed(6))).join(',');
    let safe=String(name).replace(/'/g,"''");
    let off=z>=13?'0.00002':z>=11?'0.00006':z>=9?'0.00020':'0.00065';
    let url=`${RF_NHD_FLOW}/query?where=${encodeURIComponent(`ftype=460 AND gnis_name='${safe}'`)}`+
      `&geometry=${encodeURIComponent(geom)}&geometryType=esriGeometryEnvelope&inSR=4326`+
      `&spatialRel=esriSpatialRelIntersects&outFields=gnis_name,reachcode,lengthkm`+
      `&returnGeometry=true&outSR=4326&geometryPrecision=5&maxAllowableOffset=${off}`+
      `&resultRecordCount=500&f=geojson`;
    let r=await fetch(url,{cache:'force-cache'}),j=await r.json();
    if(!r.ok||j.error||!(j.features||[]).length)throw 0;

    if(!RF_HYDRO_SELECT_LAYER)RF_HYDRO_SELECT_LAYER=L.layerGroup().addTo(M);
    RF_HYDRO_SELECT_LAYER.clearLayers();
    let blue=!!MAP_SELECTED?.blue,outer=blue?'#6f5510':'#064f5c',inner=blue?RF_RIVER_BLUE_COLOR:'#17a9bf';
    L.geoJSON(j,{pane:'rfMajorLines',renderer:RF_MAJOR_RENDERER||RF_MAP_RENDERER||undefined,
      style:{color:outer,weight:8,opacity:.28,interactive:false,lineCap:'round',lineJoin:'round'}}).addTo(RF_HYDRO_SELECT_LAYER);
    L.geoJSON(j,{pane:'rfMajorLines',renderer:RF_MAJOR_RENDERER||RF_MAP_RENDERER||undefined,
      style:{color:inner,weight:5,opacity:1,interactive:false,lineCap:'round',lineJoin:'round'}}).addTo(RF_HYDRO_SELECT_LAYER);
  }catch{
    rfHighlightTappedFeature(fallbackFeature);
  }
}

/* Resolve the river as before, but highlight the named system visible on screen. */
const RF_V210_OPEN_BASE=rfOpenTappedHydroFeature;
rfOpenTappedHydroFeature=function(f,latlng){
  RF_V210_OPEN_BASE(f,latlng);
  let name=rfFeatureName(f);
  if(name){
    setTimeout(()=>rfHighlightNamedRiverInView(name,rfStateAtPoint(+latlng.lat,+latlng.lng),f),0);
  }
};

/* Tell the user quietly when RiverFlow recovered a named mainstem from an unnamed NHD piece. */
const RF_V210_SHEET_BASE=rfRiverSheet;
rfRiverSheet=function(w){
  let h=RF_V210_SHEET_BASE(w);if(!w)return h;
  if(w._resolvedMainstem){
    h=h.replace(/(<p class="rfHydroIdentity">[\s\S]*?<\/p>)/,`$1<span class="rfResolvedRiverNote">Named mainstem resolved from the stretch you tapped</span>`);
  }
  return h;
};

/* Carry resolver provenance into the selected water object. */
const RF_V210_OPEN_WRAP=rfOpenTappedHydroFeature;
rfOpenTappedHydroFeature=function(f,latlng){
  let recovered=!!f?.properties?._rfResolvedFromUnnamed;
  RF_V210_OPEN_BASE(f,latlng);
  if(MAP_SELECTED&&recovered)MAP_SELECTED._resolvedMainstem=true;
  let name=rfFeatureName(f);
  if(name)setTimeout(()=>rfHighlightNamedRiverInView(name,rfStateAtPoint(+latlng.lat,+latlng.lng),f),0);
};

<style id="rf-v211-area-aware-style">
.rfResolvedRiverNote.area:before{content:"≈"}
.rfResolvedRiverNote.scale:before{content:"✓"}

<script id="rf-v211-area-aware-script">
/* RiverFlow v2.11 — area-aware river identity
   The visible USGS hydrography map can represent a river as:
   1) a detailed NHD flowline,
   2) a named Stream/River area polygon for wide/braided channels, or
   3) a generalized small-scale named mainstem.
   RiverFlow now resolves identity from all three before ever calling visible water "Unnamed". */

const RF_NHD_FLOW_SMALL='https://hydro.nationalmap.gov/arcgis/rest/services/nhd/MapServer/4';
const RF_NHD_AREA_LARGE='https://hydro.nationalmap.gov/arcgis/rest/services/nhd/MapServer/9';
const RF_NHD_WATERBODY_LARGE='https://hydro.nationalmap.gov/arcgis/rest/services/nhd/MapServer/12';

function rfSqlText(v){return String(v||'').replace(/'/g,"''")}

async function rfPointPolygonName(layerUrl,latlng,req){
  let point=`${(+latlng.lng).toFixed(7)},${(+latlng.lat).toFixed(7)}`;
  let url=`${layerUrl}/query?where=${encodeURIComponent("GNIS_NAME IS NOT NULL")}`+
    `&geometry=${encodeURIComponent(point)}&geometryType=esriGeometryPoint&inSR=4326`+
    `&spatialRel=esriSpatialRelIntersects&outFields=GNIS_NAME,GNIS_ID,PERMANENT_IDENTIFIER,FTYPE,FCODE,AREASQKM,REACHCODE`+
    `&returnGeometry=false&resultRecordCount=10&f=json`;
  try{
    let r=await fetch(url,{cache:'force-cache'}),j=await r.json();
    if(req!==RF_HYDRO_TAP_REQ)return null;
    if(!r.ok||j.error)return null;
    let a=(j.features||[]).map(x=>x.attributes||x.properties||{})
      .filter(p=>String(p.GNIS_NAME||p.gnis_name||'').trim());
    if(!a.length)return null;
    // Prefer actual Stream/River polygons, then larger named polygons.
    a.sort((x,y)=>{
      let xf=+(x.FTYPE??x.ftype),yf=+(y.FTYPE??y.ftype);
      let xr=xf===460?1:0,yr=yf===460?1:0;
      return yr-xr || (+y.AREASQKM||0)-(+x.AREASQKM||0);
    });
    let p=a[0];
    return{
      name:String(p.GNIS_NAME||p.gnis_name||'').trim(),
      gnisId:p.GNIS_ID||p.gnis_id||'',
      permanentId:p.PERMANENT_IDENTIFIER||p.permanent_identifier||'',
      reachcode:p.REACHCODE||p.reachcode||'',
      source:layerUrl===RF_NHD_AREA_LARGE?'area':'waterbody'
    };
  }catch{return null}
}

async function rfNameByWbAreaId(id,req){
  if(!id)return null;
  const where=`PERMANENT_IDENTIFIER='${rfSqlText(id)}'`;
  for(const layerUrl of [RF_NHD_AREA_LARGE,RF_NHD_WATERBODY_LARGE]){
    let url=`${layerUrl}/query?where=${encodeURIComponent(where)}`+
      `&outFields=GNIS_NAME,GNIS_ID,PERMANENT_IDENTIFIER,FTYPE,FCODE,AREASQKM,REACHCODE`+
      `&returnGeometry=false&resultRecordCount=5&f=json`;
    try{
      let r=await fetch(url,{cache:'force-cache'}),j=await r.json();
      if(req!==RF_HYDRO_TAP_REQ)return null;
      if(!r.ok||j.error)continue;
      let p=(j.features||[]).map(x=>x.attributes||x.properties||{})
        .find(x=>String(x.GNIS_NAME||x.gnis_name||'').trim());
      if(p)return{
        name:String(p.GNIS_NAME||p.gnis_name).trim(),
        gnisId:p.GNIS_ID||p.gnis_id||'',
        permanentId:p.PERMANENT_IDENTIFIER||p.permanent_identifier||id,
        reachcode:p.REACHCODE||p.reachcode||'',
        source:'linked-area'
      };
    }catch{}
  }
  return null;
}

async function rfSmallScaleNamedMainstem(latlng,meters,baseAngle,st,req){
  let point=`${(+latlng.lng).toFixed(7)},${(+latlng.lat).toFixed(7)}`;
  // Generalized NHD is used for NAME RESOLUTION only; detailed geometry stays on screen.
  let radius=Math.max(1200,Math.min(18000,meters*5.5));
  let url=`${RF_NHD_FLOW_SMALL}/query?where=${encodeURIComponent("ftype=460 AND gnis_name IS NOT NULL")}`+
    `&geometry=${encodeURIComponent(point)}&geometryType=esriGeometryPoint&inSR=4326`+
    `&spatialRel=esriSpatialRelIntersects&distance=${Math.round(radius)}&units=esriSRUnit_Meter`+
    `&outFields=gnis_name,gnis_id,reachcode,lengthkm,visibilityfilter,mainpath,innetwork`+
    `&returnGeometry=true&outSR=4326&geometryPrecision=5&resultRecordCount=35&f=geojson`;
  try{
    let r=await fetch(url,{cache:'force-cache'}),j=await r.json();
    if(req!==RF_HYDRO_TAP_REQ)return null;
    if(!r.ok||j.error)return null;
    let major=rfMajorNameSet(st);
    let a=(j.features||[]).map(f=>{
      let m=rfHydroPointMetrics(f,latlng);
      let n=rfFeatureName(f),k=rfHydroKey(n);
      let vis=+(f.properties?.visibilityfilter||0),main=+(f.properties?.mainpath||0);
      // Small-scale named streams visible from farther out deserve a major score bonus.
      let score=m.d + rfAngleDelta(baseAngle,m.angle)*.18
        - (major.has(k)?28:0)
        - (main?10:0)
        - Math.min(18,vis/120000)
        - Math.min(10,(+f.properties?.lengthkm||0)*.25);
      return{f,...m,score};
    }).filter(x=>rfFeatureName(x.f)&&Number.isFinite(x.d));
    if(!a.length)return null;
    a.sort((x,y)=>x.score-y.score);
    let best=a[0];
    // Naming may snap farther than the visual hit target, but never to a wildly distant river.
    if(best.d>130)return null;
    return best.f;
  }catch{return null}
}

function rfApplyResolvedName(feature,resolved,kind){
  if(!feature||!resolved?.name)return feature;
  feature.properties=feature.properties||{};
  feature.properties.gnis_name=resolved.name;
  if(resolved.gnisId)feature.properties.gnis_id=resolved.gnisId;
  if(resolved.reachcode&&!feature.properties.reachcode)feature.properties.reachcode=resolved.reachcode;
  feature.properties._rfResolvedFromUnnamed=1;
  feature.properties._rfIdentitySource=kind||resolved.source||'resolved';
  return feature;
}

/* Full resolver:
   A. Query high-detail lines around tap.
   B. If nearest detail line is unnamed, ask named river-area/waterbody polygon at exact tap.
   C. Follow the detail flowline's linked WBArea identifier.
   D. Prefer another nearby named detailed segment.
   E. Ask the generalized/small-scale named mainstem layer.
   F. Only then return truly unnamed. */
rfQueryHydroAtTap=async function(latlng){
  if(!M)return null;
  const req=++RF_HYDRO_TAP_REQ;
  const mobile=matchMedia?.('(max-width:700px)')?.matches!==false;
  const px=mobile?28:21;
  const z=M.getZoom();
  const meters=rfHydroTapRadiusMeters(latlng,px);
  const off=z>=13?'0.00002':z>=10?'0.00009':z>=8?'0.00034':'0.0009';
  let point=`${(+latlng.lng).toFixed(7)},${(+latlng.lat).toFixed(7)}`;

  let url=`${RF_NHD_FLOW}/query?where=${encodeURIComponent("ftype=460")}`+
    `&geometry=${encodeURIComponent(point)}&geometryType=esriGeometryPoint&inSR=4326`+
    `&spatialRel=esriSpatialRelIntersects&distance=${Math.round(meters)}&units=esriSRUnit_Meter`+
    `&outFields=gnis_name,gnis_id,reachcode,fcode,ftype,lengthkm,wbarea_permanent_identifier,permanent_identifier,mainpath,innetwork,visibilityfilter`+
    `&returnGeometry=true&outSR=4326&geometryPrecision=5&maxAllowableOffset=${off}`+
    `&resultRecordCount=60&f=geojson`;

  try{
    let r=await fetch(url,{cache:'force-cache'}),j=await r.json();
    if(req!==RF_HYDRO_TAP_REQ)return null;
    if(!r.ok||j.error)throw Error(j.error?.message||`Hydrography ${r.status}`);

    let all=(j.features||[]).map(f=>({f,...rfHydroPointMetrics(f,latlng)}))
      .filter(x=>Number.isFinite(x.d)).sort((a,b)=>a.d-b.d);
    let nearest=all[0];
    if(!nearest||nearest.d>px+11)return null;

    if(rfFeatureName(nearest.f))return nearest.f;

    const st=rfStateAtPoint(+latlng.lat,+latlng.lng);

    // B. The user may be tapping a wide/braided river AREA rather than its named centerline.
    let [areaName,waterbodyName]=await Promise.all([
      rfPointPolygonName(RF_NHD_AREA_LARGE,latlng,req),
      rfPointPolygonName(RF_NHD_WATERBODY_LARGE,latlng,req)
    ]);
    if(req!==RF_HYDRO_TAP_REQ)return null;
    if(areaName?.name)return rfApplyResolvedName(nearest.f,areaName,'named-river-area');
    if(waterbodyName?.name)return rfApplyResolvedName(nearest.f,waterbodyName,'named-waterbody');

    // C. NHD detail lines often explicitly link to the river/waterbody area they pass through.
    let wb=nearest.f?.properties?.wbarea_permanent_identifier;
    if(wb){
      let linked=await rfNameByWbAreaId(wb,req);
      if(req!==RF_HYDRO_TAP_REQ)return null;
      if(linked?.name)return rfApplyResolvedName(nearest.f,linked,'linked-river-area');
    }

    // D. Nearby named detailed line, with much more tolerance for braided mainstem channels.
    const snapPx=mobile?105:82;
    let named=all.filter(x=>rfFeatureName(x.f)&&x.d<=snapPx);
    if(named.length){
      named.sort((a,b)=>rfNamedCandidateScore(a,nearest.angle,st)-rfNamedCandidateScore(b,nearest.angle,st));
      let best=named[0];
      // If it is a known RiverFlow river or strongly aligned, accept it.
      let known=rfSystemCandidates(rfFeatureName(best.f),st).length>0;
      let aligned=rfAngleDelta(nearest.angle,best.angle)<=55;
      if(known||aligned){
        best.f.properties=best.f.properties||{};
        best.f.properties._rfResolvedFromUnnamed=1;
        best.f.properties._rfIdentitySource='nearby-detailed-mainstem';
        return best.f;
      }
    }

    // E. This is the crucial scale mismatch fallback: use generalized NHD to recover the
    // name shown by the regional/cached map, while retaining the exact detailed tap location.
    let small=await rfSmallScaleNamedMainstem(latlng,meters,nearest.angle,st,req);
    if(req!==RF_HYDRO_TAP_REQ)return null;
    if(small){
      return rfApplyResolvedName(nearest.f,{
        name:rfFeatureName(small),
        gnisId:small.properties?.gnis_id,
        reachcode:small.properties?.reachcode
      },'generalized-mainstem');
    }

    // F. Wider named detailed recovery only after area + generalized-network checks.
    let recoveryMeters=Math.min(16000,Math.max(meters*5,1500));
    let recovered=await rfNamedRecoveryQuery(latlng,recoveryMeters,off,req);
    if(req!==RF_HYDRO_TAP_REQ)return null;
    let good=recovered.filter(x=>x.d<=snapPx+28);
    if(good.length){
      good.sort((a,b)=>rfNamedCandidateScore(a,nearest.angle,st)-rfNamedCandidateScore(b,nearest.angle,st));
      let best=good[0];
      let known=rfSystemCandidates(rfFeatureName(best.f),st).length>0;
      if(known||rfAngleDelta(nearest.angle,best.angle)<=60){
        best.f.properties=best.f.properties||{};
        best.f.properties._rfResolvedFromUnnamed=1;
        best.f.properties._rfIdentitySource='wider-named-recovery';
        return best.f;
      }
    }

    return nearest.f;
  }catch(e){
    console.warn('RiverFlow area-aware hydro tap',e);
    return null;
  }
};

/* Preserve identity provenance on the selected water so the sheet can explain the match. */
const RF_V211_OPEN_BASE=rfOpenTappedHydroFeature;
rfOpenTappedHydroFeature=function(f,latlng){
  let source=f?.properties?._rfIdentitySource||'';
  RF_V211_OPEN_BASE(f,latlng);
  if(MAP_SELECTED&&source){
    MAP_SELECTED._resolvedMainstem=true;
    MAP_SELECTED._identitySource=source;
  }
};

const RF_V211_SHEET_BASE=rfRiverSheet;
rfRiverSheet=function(w){
  let h=RF_V211_SHEET_BASE(w);if(!w)return h;
  if(w._identitySource){
    let text=
      /area|waterbody/.test(w._identitySource)?'River identity matched from the named USGS river channel':
      w._identitySource==='generalized-mainstem'?'River identity matched to the named USGS mainstem':
      'Named river mainstem resolved from the stretch you tapped';
    // Avoid duplicate resolver badges from prior prototype layers.
    h=h.replace(/<span class="rfResolvedRiverNote[^"]*">[\s\S]*?<\/span>/g,'');
    h=h.replace(/(<p class="rfHydroIdentity">[\s\S]*?<\/p>)/,`$1<span class="rfResolvedRiverNote ${/area|waterbody/.test(w._identitySource)?'area':'scale'}">${E(text)}</span>`);
  }
  return h;
};

window.RIVERFLOW_PROTOTYPE_VERSION='v2.11-area-aware-river-identity';
try{document.title='RiverFlow — Area-Aware River Identity'}catch{}
setTimeout(()=>{try{if(!S&&APP_TAB!=='bugs')draw()}catch(e){console.warn('RiverFlow v2.11 refresh',e)}},230);
</script>


<style id="rf-v212-full-system-lines-style">
/* RiverFlow v2.12 — full named fishing-river systems */
.rfFullSystemLabel{
  background:#fffffff0!important;
  border:1px solid #d5e0dd!important;
  border-radius:7px!important;
  box-shadow:0 2px 7px #183a3625!important;
  color:#244b50!important;
  font:900 9px/1 system-ui,-apple-system,sans-serif!important;
  padding:4px 6px!important;
  pointer-events:none!important
}
.rfFullSystemLabel.gold{color:#79590b!important;border-color:#dfc66d!important;background:#fff9e6f2!important}
.rfFullSystemLabel:before{display:none!important}
</style>

<script id="rf-v212-full-system-lines-script">
/* RiverFlow v2.12
   Full-system pronounced river lines.

   Previous state-wide request could hit ArcGIS transfer limits before every segment
   of every named river was returned. That produced short/sliver RiverFlow lines.
   This loader pages EACH named fishery separately, then compacts the entire named
   system into lightweight blue/gold MultiLineStrings.

   The cached USGS raster hydrography still shows every mapped creek.
   These pronounced vectors are the premium clickable "known fishing river" layer. */

const RF_FULL_SYSTEM_CACHE=new Map();
const RF_FULL_SYSTEM_LOADING=new Map();
let RF_FULL_SYSTEM_RENDER_TOKEN=0;
let RF_FULL_SYSTEM_DRAW_KEY='';
let RF_FULL_SYSTEM_LABEL_LAYER=null;

function rfV212Lines(g){
  if(!g)return[];
  if(g.type==='LineString')return Array.isArray(g.coordinates)?[g.coordinates]:[];
  if(g.type==='MultiLineString')return Array.isArray(g.coordinates)?g.coordinates:[];
  if(g.type==='GeometryCollection')return (g.geometries||[]).flatMap(x=>rfV212Lines(x));
  return[];
}

async function rfV212FetchRiverPage(st,name,offset,pageSize,simplify){
  const bb=RF_STATE_BOUNDS[st];
  const geom=[bb[0][1],bb[0][0],bb[1][1],bb[1][0]].join(',');
  const where=`ftype=460 AND gnis_name=${rfSqlQuote(name)}`;
  const u=`${RF_NHD_FLOW}/query?where=${encodeURIComponent(where)}`+
    `&geometry=${encodeURIComponent(geom)}&geometryType=esriGeometryEnvelope&inSR=4326`+
    `&spatialRel=esriSpatialRelIntersects`+
    `&outFields=OBJECTID,gnis_name,reachcode,lengthkm`+
    `&returnGeometry=true&outSR=4326&geometryPrecision=5`+
    `&maxAllowableOffset=${simplify}`+
    `&resultOffset=${offset}&resultRecordCount=${pageSize}`+
    `&orderByFields=OBJECTID&returnExceededLimitFeatures=true&f=geojson`;

  let r=await fetch(u,{cache:'force-cache'});
  let j=await r.json();
  if(!r.ok||j.error)throw Error(j.error?.message||`${name} ${r.status}`);
  return j;
}

async function rfV212FetchWholeRiver(st,name){
  const mobile=matchMedia?.('(max-width:700px)')?.matches!==false;
  // ~25–45 m generalization is enough for a thick exploration line while keeping
  // the full river cheap enough to retain in memory.
  const simplify=mobile?'0.00036':'0.00022';
  const pageSize=700;
  const maxPages=8;
  let features=[];

  for(let page=0;page<maxPages;page++){
    let j=await rfV212FetchRiverPage(st,name,page*pageSize,pageSize,simplify);
    let a=j.features||[];
    features.push(...a);

    // ArcGIS may expose exceededTransferLimit; if not, a short page is the stop signal.
    if(!j.exceededTransferLimit&&a.length<pageSize)break;
    if(!a.length)break;
  }

  return features;
}

function rfV212CompactRiver(st,name,features){
  const groups=new Map();
  let representative=null,repKm=-1,totalKm=0;

  for(const f of features||[]){
    let parts=rfV212Lines(f.geometry).filter(x=>Array.isArray(x)&&x.length>1);
    if(!parts.length)continue;

    let c=rfNhdCenter(f.geometry);
    let blue=!!(c&&rfBlueReachNear(name,c,st));
    let key=blue?'gold':'blue';

    if(!groups.has(key)){
      groups.set(key,{
        type:'Feature',
        properties:{
          gnis_name:name,
          rf_state:st,
          rf_blue:blue?1:0,
          rf_full_system:1
        },
        geometry:{type:'MultiLineString',coordinates:[]}
      });
    }
    groups.get(key).geometry.coordinates.push(...parts);

    let km=Number(f?.properties?.lengthkm)||0;
    totalKm+=km;
    if(c&&km>repKm){representative=c;repKm=km}
  }

  return{
    features:[...groups.values()],
    representative,
    totalKm,
    segmentCount:(features||[]).length
  };
}

async function rfV212FetchStateSystems(st){
  if(RF_FULL_SYSTEM_CACHE.has(st))return RF_FULL_SYSTEM_CACHE.get(st);
  if(RF_FULL_SYSTEM_LOADING.has(st))return RF_FULL_SYSTEM_LOADING.get(st);

  const p=(async()=>{
    const names=rfMajorNames(st);
    const systems=[];

    // Small concurrency batches protect phones and the USGS service.
    const concurrency=3;
    for(let i=0;i<names.length;i+=concurrency){
      let batch=names.slice(i,i+concurrency);
      let rows=await Promise.all(batch.map(async name=>{
        try{
          let raw=await rfV212FetchWholeRiver(st,name);
          return{name,...rfV212CompactRiver(st,name,raw)};
        }catch(e){
          console.warn('RiverFlow full river system',st,name,e);
          return{name,features:[],representative:null,totalKm:0,segmentCount:0};
        }
      }));
      systems.push(...rows);
    }

    let result={st,systems};
    RF_FULL_SYSTEM_CACHE.set(st,result);
    return result;
  })().finally(()=>RF_FULL_SYSTEM_LOADING.delete(st));

  RF_FULL_SYSTEM_LOADING.set(st,p);
  return p;
}

function rfV212Width(z,blue){
  if(z<=5.5)return blue?6.2:5.5;
  if(z<=6.5)return blue?6.0:5.3;
  if(z<=7.5)return blue?5.7:5.0;
  if(z<=8.5)return blue?5.3:4.7;
  if(z<=9.5)return blue?4.9:4.3;
  if(z<=11)return blue?4.6:4.0;
  return blue?4.2:3.7;
}

function rfV212SystemSelected(name,st){
  if(!MAP_SELECTED)return false;
  if(st&&MAP_SELECTED.state&&MAP_SELECTED.state!==st)return false;
  return rfHydroKey(MAP_SELECTED.hydroOfficialName||MAP_SELECTED.hydroName||MAP_SELECTED.name)===rfHydroKey(name);
}

function rfV212AddSystemLabel(name,point,isGold,z){
  if(!RF_FULL_SYSTEM_LABEL_LAYER||!point||z<6.0||z>9.8)return;
  let cls='rfFullSystemLabel'+(isGold?' gold':'');
  L.marker([point.lat,point.lng],{
    interactive:false,keyboard:false,
    icon:L.divIcon({
      className:'',
      html:`<div class="${cls}">${isGold?'◆ ':''}${E(name)}</div>`,
      iconSize:null,iconAnchor:[0,0]
    })
  }).addTo(RF_FULL_SYSTEM_LABEL_LAYER);
}

async function rfV212RenderFullSystems(){
  if(!M||!RF_MAJOR_LAYER)return;
  if(!rfFilterOn('rivers')){
    RF_MAJOR_LAYER.clearLayers();
    RF_MAJOR_OUTLINE_LAYER?.clearLayers();
    RF_MAJOR_STAR_LAYER?.clearLayers();
    RF_FULL_SYSTEM_LABEL_LAYER?.clearLayers();
    RF_FULL_SYSTEM_DRAW_KEY='';
    return;
  }

  const z=M.getZoom();
  const states=rfMajorVisibleStates();
  const key=states.join(',')+'|'+Math.floor(z*2)/2;
  if(key===RF_FULL_SYSTEM_DRAW_KEY)return;

  const token=++RF_FULL_SYSTEM_RENDER_TOKEN;
  const data=await Promise.all(states.map(rfV212FetchStateSystems));
  if(token!==RF_FULL_SYSTEM_RENDER_TOKEN||!M)return;

  RF_MAJOR_LAYER.clearLayers();
  RF_MAJOR_OUTLINE_LAYER?.clearLayers();
  RF_MAJOR_STAR_LAYER?.clearLayers();
  if(!RF_FULL_SYSTEM_LABEL_LAYER)RF_FULL_SYSTEM_LABEL_LAYER=L.layerGroup().addTo(M);
  else RF_FULL_SYSTEM_LABEL_LAYER.clearLayers();

  for(const stateData of data){
    const st=stateData.st;
    let labelsUsed=0;
    const farLabelCap=z<6.5?8:999;

    for(const system of stateData.systems){
      if(!system.features.length)continue;

      for(const f of system.features){
        const blue=!!(+f.properties?.rf_blue);
        const selected=rfV212SystemSelected(system.name,st);

        L.geoJSON(f,{
          renderer:RF_MAJOR_RENDERER||RF_MAP_RENDERER||undefined,
          pane:'rfMajorLines',
          style:{
            color:selected?RF_RIVER_SELECTED_COLOR:(blue?RF_RIVER_BLUE_COLOR:RF_RIVER_NORMAL_COLOR),
            weight:rfV212Width(z,blue)+(selected?1.5:0),
            opacity:.98,
            interactive:true,
            lineCap:'round',
            lineJoin:'round'
          },
          onEachFeature:(feature,layer)=>{
            // The line itself — not a gauge/star/marker — is the primary river control.
            layer.on('click',e=>{
              RF_LAST_DIRECT_RIVER_TAP=Date.now();
              rfOpenTappedHydroFeature(feature,e.latlng);
            });
            if(z>=7&&z<=10.3){
              layer.bindTooltip(`${blue?'◆ ':''}${E(system.name)}`,{
                sticky:true,
                className:'rfMajorLabel'
              });
            }
          }
        }).addTo(RF_MAJOR_LAYER);
      }

      if(system.representative&&labelsUsed<farLabelCap){
        const gold=system.features.some(f=>!!(+f.properties?.rf_blue));
        rfV212AddSystemLabel(system.name,system.representative,gold,z);
        labelsUsed++;
      }

      // Saved river star remains only a shortcut. It is no longer required for selection.
      if(system.representative){
        let w=rfRiverCatalogMatch(system.name,system.representative.lat,system.representative.lng,st)
          ||rfSafeRiverSystemWater(system.name,system.representative.lat,system.representative.lng,st);
        if(rfSavedWater(w)){
          let icon=L.divIcon({
            className:'',
            html:'<div class="rfSavedRiverStar">★</div>',
            iconSize:[24,24],iconAnchor:[12,12]
          });
          L.marker([system.representative.lat,system.representative.lng],{
            icon,pane:'markerPane',keyboard:false
          }).addTo(RF_MAJOR_STAR_LAYER)
            .bindTooltip(`Saved · ${E(system.name)}`,{direction:'top'})
            .on('click',()=>{
              let ll={lat:system.representative.lat,lng:system.representative.lng};
              let feature=system.features[0];
              RF_LAST_DIRECT_RIVER_TAP=Date.now();
              rfOpenTappedHydroFeature(feature,ll);
            });
        }
      }
    }
  }

  RF_FULL_SYSTEM_DRAW_KEY=key;
}

rfRenderMajorRivers=rfV212RenderFullSystems;
rfMajorSchedule=function(){
  clearTimeout(rfMajorSchedule.t);
  rfMajorSchedule.t=setTimeout(rfV212RenderFullSystems,180);
};

/* Keep full system vectors alive at every useful fishing zoom.
   Dense NHD tributaries may appear on top, but the pronounced named mainstem remains. */
const RF_V212_DENSE_NHD_BASE=rfLoadNhdViewport;
rfLoadNhdViewport=async function(){
  let result=await RF_V212_DENSE_NHD_BASE();
  setTimeout(rfMajorSchedule,0);
  return result;
};

/* Selection restyles the entire river system, not just one reach/point. */
const RF_V212_SELECTION_BASE=renderSelectionHost;
renderSelectionHost=function(){
  RF_V212_SELECTION_BASE();
  RF_FULL_SYSTEM_DRAW_KEY='';
  rfMajorSchedule();
};

/* Full-system vectors are now authoritative for pronounced fishery rivers.
   If the map background tap-query finds an unnamed side channel sitting on top of
   one of these visible lines, the vector click fires first and wins. */
window.RIVERFLOW_PROTOTYPE_VERSION='v2.12-full-river-system-lines';
try{document.title='RiverFlow — Full River System Lines'}catch{}

setTimeout(()=>{
  try{
    RF_FULL_SYSTEM_CACHE.clear();
    RF_FULL_SYSTEM_DRAW_KEY='';
    if(!S&&APP_TAB!=='bugs')draw();
    setTimeout(rfMajorSchedule,420);
  }catch(e){console.warn('RiverFlow v2.12 refresh',e)}
},240);
</script>
